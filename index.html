        <div class="grid" style=${{gridTemplateColumns:"repeat(4,1fr)",gap:"6px"}}>${fx.map(([l,q])=>html`<div key=${l} class="mini c"><b class="num">${q}</b><span class="note">${l}</span></div>`)}</div>
      </div>
    </div>
  </div>`;
}

/* ---------- Hub de Performance ---------- */
function Hub({st,go}){
  const at=ativos(st), gk=at.filter(j=>j.pos==="GOL"), linha=at.filter(j=>j.pos!=="GOL");
  const c=k=>at.filter(j=>(j.saude||"Liberado")===k).length;
  const dores=st.psr.filter(p=>p.data&&diasEntre(p.data,hoje())<14&&diasEntre(p.data,hoje())>=0&&n(p.dor)>=4).sort((a,b)=>b.data.localeCompare(a.data));
  const queixas=st.atend.filter(a=>a.data&&diasEntre(a.data,hoje())<30&&diasEntre(a.data,hoje())>=0).sort((a,b)=>b.data.localeCompare(a.data));
  const rec=ultimosDias(7).map(d=>({x:new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short"}),y:avg(st.psr.filter(p=>p.data===d).map(p=>n(p.recup)))}));
  const pr=at.map(j=>({j,...prontidao(st,j)})).sort((a,b)=>(b.sc??-1)-(a.sc??-1));
  const libLinha=linha.filter(j=>(j.saude||"Liberado")==="Liberado").length;
  return html`<div class="grid" style=${{gap:"16px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Atletas de linha liberados" v=${libLinha} d=${`${linha.length?Math.round(libLinha/linha.length*100):0}% da linha`}/>
      <${Kpi} l="Goleiros liberados" v=${gk.filter(j=>(j.saude||"Liberado")==="Liberado").length} d=${`de ${gk.length} goleiros`}/>
      <${Kpi} l="Em observação" v=${c("Sob observação")} d="liberados com observação"/>
      <${Kpi} l="Em transição" v=${c("Em transição")} d="retorno progressivo"/>
      <${Kpi} l="Indisponíveis" v=${c("Não liberado")} d="afastados"/>
    </div>
    <div class="grid g-3">
      <div class="card"><div class="card-h"><div><h2>Dores PSR</h2><p>Últimos 14 dias · dor ≥ 4</p></div><button class="btn sm ghost" onClick=${()=>go("fisiologia")}>Registrar →</button></div>
        ${dores.length?html`<div class="alerts">${dores.slice(0,8).map(p=>html`<div key=${p.id} class="alert bad"><div><b>${nomeA(st,p.atleta)} · dor ${p.dor}</b><span>${fmtD(p.data)}${p.regiao?" · "+p.regiao:""}</span></div></div>`)}</div>`:html`<p class="note">Nenhuma dor relevante registrada nos últimos 14 dias.</p>`}</div>
      <div class="card"><div class="card-h"><div><h2>Queixas fisioterapia</h2><p>Últimos 30 dias</p></div><button class="btn sm ghost" onClick=${()=>go("fisioterapia")}>Abrir →</button></div>
        ${queixas.length?html`<div class="alerts">${queixas.slice(0,8).map(a=>html`<div key=${a.id} class="alert"><div><b>${nomeA(st,a.atleta)}</b><span>${fmtD(a.data)} · ${a.queixa||"—"}${a.regiao?" · "+a.regiao:""}</span></div></div>`)}</div>`:html`<p class="note">Nenhuma queixa registrada nos últimos 30 dias.</p>`}</div>
      <div class="card"><div class="card-h"><div><h2>Recuperação média</h2><p>Percepção de recuperação (1–10) por dia</p></div></div><${Serie} pts=${rec} ymin=${0} ymax=${10} cor="var(--good)"/></div>
    </div>
    <div class="card">
      <div class="card-h"><div><h2>Algoritmo de prontidão</h2><p>Último PSR (sono, fadiga, dor, humor, recuperação) + ACWR da carga (PSE × minutos) + status médico</p></div>
        <div class="legend"><span><i style=${{background:"var(--good)"}}></i>≥ 75</span><span><i style=${{background:"var(--warn)"}}></i>55–74</span><span><i style=${{background:"var(--bad)"}}></i>${"< 55"}</span></div></div>
      ${pr.some(x=>x.sc!=null)||pr.some(x=>x.a!=null) ? html`<div class="pront">${pr.map(({j,sc,a,ps})=>html`<div key=${j.id} class="pront-i">
          <span class="av" style=${{borderColor:corPront(sc)}}>${iniciais(j.nome)}</span>
          <div style=${{minWidth:0,flex:1}}><div class="nm">${j.nome}</div><div class="meta">${POSN[j.pos]?.s} · ${ps?"PSR "+fmtD(ps.data):"sem PSR"} · ACWR <span style=${{color:corAcwr(a)}}>${a==null?"—":f2(a)}</span></div><${Barra} v=${sc} cor=${corPront(sc)}/></div>
          <b class="num" style=${{color:corPront(sc),fontFamily:"var(--f-display)",fontSize:"24px",minWidth:"40px",textAlign:"right"}}>${sc??"—"}</b></div>`)}</div>`
      : html`<div class="empty">Nenhum dado de atleta ainda. Registre o bem-estar (PSR) e a carga (PSE) em Fisiologia para ver a prontidão.</div>`}
    </div>
  </div>`;
}

/* ---------- Elenco (saúde e disponibilidade) ---------- */
function ElencoCards({st,up}){
  const [q,setQ]=useState(""); const [fv,setFv]=useState("Ativo"); const [fp,setFp]=useState(""); const [fs,setFs]=useState(""); const [fd,setFd]=useState(""); const [ord,setOrd]=useState("nome"); const [vis,setVis]=useState("cards");
  const ano=new Date().getFullYear();
  const set=(id,k,v)=>up(s=>({...s, elenco:s.elenco.map(j=>j.id===id?{...j,[k]:v}:j)}));
  const base=st.elenco.filter(j=>!fv||(j.vinculo||"Ativo")===fv);
  const lista=base.filter(j=>(!fp||j.pos===fp)&&(!fs||(j.saude||"Liberado")===fs)&&(!fd||(fd==="com"?!!j.dor:!j.dor))&&(!q||j.nome.toLowerCase().includes(q.toLowerCase())))
    .map(j=>({...j,_p:prontidao(st,j)}))
    .sort((a,b)=>ord==="pos"?POS.findIndex(p=>p.k===a.pos)-POS.findIndex(p=>p.k===b.pos):ord==="status"?SAUDE.indexOf(a.saude||"Liberado")-SAUDE.indexOf(b.saude||"Liberado"):ord==="rec"?(b._p.sc??-1)-(a._p.sc??-1):a.nome.localeCompare(b.nome));
  const at=base; const c=k=>at.filter(j=>(j.saude||"Liberado")===k).length;
  return html`<div class="grid" style=${{gap:"14px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Atletas de linha lib." v=${at.filter(j=>j.pos!=="GOL"&&(j.saude||"Liberado")==="Liberado").length}/>
      <${Kpi} l="Goleiros disp." v=${at.filter(j=>j.pos==="GOL"&&(j.saude||"Liberado")==="Liberado").length}/>
      <${Kpi} l="Lib. c/ obs." v=${c("Sob observação")}/>
      <${Kpi} l="Transição" v=${c("Em transição")}/>
      <${Kpi} l="Não liberados" v=${c("Não liberado")}/>
    </div>
    <div class="poscards">${POS.map(p=>{ const js=at.filter(j=>j.pos===p.k); return html`<button key=${p.k} class=${"poscard"+(fp===p.k?" on":"")} onClick=${()=>setFp(fp===p.k?"":p.k)}><b>${p.n}</b><span>${js.filter(j=>(j.saude||"Liberado")==="Liberado").length}/${js.length} disponíveis</span></button>`; })}</div>
    <div class="toolbar" style=${{marginBottom:0}}>
      <input class="field grow" id="busca-cards" placeholder="Buscar atleta" value=${q} onInput=${e=>setQ(e.target.value)}/>
      <select class="field" id="f-vinc" style=${{width:"auto"}} value=${fv} onChange=${e=>setFv(e.target.value)}><option value="">Todos os vínculos</option>${VINCULOS.map(v=>html`<option key=${v}>${v}</option>`)}</select>
      <select class="field" id="f-pos2" style=${{width:"auto"}} value=${fp} onChange=${e=>setFp(e.target.value)}><option value="">Todas as posições</option>${POS.map(p=>html`<option key=${p.k} value=${p.k}>${p.s}</option>`)}</select>
      <select class="field" id="f-saude" style=${{width:"auto"}} value=${fs} onChange=${e=>setFs(e.target.value)}><option value="">Todos os status</option>${SAUDE.map(v=>html`<option key=${v}>${v}</option>`)}</select>
      <select class="field" id="f-dor" style=${{width:"auto"}} value=${fd} onChange=${e=>setFd(e.target.value)}><option value="">Dor: todos</option><option value="com">Com dor</option><option value="sem">Sem dor</option></select>
      <select class="field" id="f-ord" style=${{width:"auto"}} value=${ord} onChange=${e=>setOrd(e.target.value)}><option value="nome">Ordenar: nome</option><option value="pos">Ordenar: posição</option><option value="status">Ordenar: status</option><option value="rec">Ordenar: prontidão</option></select>
      <div class="seg"><button class=${vis==="cards"?"on":""} onClick=${()=>setVis("cards")}>Cards</button><button class=${vis==="lista"?"on":""} onClick=${()=>setVis("lista")}>Lista</button></div>
    </div>
    <p class="note" style=${{margin:0}}>${lista.length} atleta(s)</p>
    ${!lista.length?html`<div class="empty">Nenhum atleta com esses filtros.</div>`:vis==="cards"?html`<div class="acards">${lista.map(j=>html`<div key=${j.id} class="acard">
        <div style=${{display:"flex",gap:"10px",alignItems:"center"}}><span class="av" style=${{width:"44px",height:"44px",fontSize:"16px",borderColor:SAUDE_COR[j.saude||"Liberado"]}}>${iniciais(j.nome)}</span>
          <div style=${{minWidth:0}}><div class="nm" style=${{fontSize:"15px"}}>${j.nome}</div><div style=${{color:"var(--red-ink)",fontSize:"12px",fontWeight:600}}>${POSN[j.pos]?.s}</div></div></div>
        <div class="meta">${idade(j,ano)??"—"} anos · ${n(j.alt)?f2(n(j.alt))+" m":"—"} · ${j.vinculo||"Ativo"}</div>
        <select class="cell" id=${"sd-"+j.id} value=${j.saude||"Liberado"} onChange=${e=>set(j.id,"saude",e.target.value)} style=${{color:SAUDE_COR[j.saude||"Liberado"],fontWeight:600,border:"1px solid var(--line2)"}}>${SAUDE.map(v=>html`<option key=${v}>${v}</option>`)}</select>
        <div class="acard-f"><div><span class="note">Prontidão</span><b class="num" style=${{color:corPront(j._p.sc)}}>${j._p.sc??"—"}</b></div><div><span class="note">ACWR</span><b class="num" style=${{color:corAcwr(j._p.a)}}>${j._p.a==null?"—":f2(j._p.a)}</b></div>
          <label style=${{display:"flex",alignItems:"center",gap:"5px",fontSize:"12px"}}><input type="checkbox" id=${"dor-"+j.id} checked=${!!j.dor} onChange=${e=>set(j.id,"dor",e.target.checked)} style=${{accentColor:"var(--red)"}}/>Dor</label></div>
      </div>`)}</div>`
    : html`<${Tabela} st=${st} rows=${lista} api=${{set,del:id=>up(s=>({...s,elenco:s.elenco.filter(j=>j.id!==id)}))}} cols=${[{k:"nome",l:"Atleta",w:"150px"},{k:"pos",l:"Posição",t:"select",opts:POS.map(p=>p.k),w:"70px"},{k:"vinculo",l:"Vínculo",t:"select",opts:VINCULOS},{k:"saude",l:"Status médico",t:"select",opts:SAUDE,cor:v=>SAUDE_COR[v]},{k:"dor",l:"Dor",t:"check"},{k:"_pr",l:"Prontidão",t:"calc",f:r=>r._p.sc??"—",cor:r=>corPront(r._p.sc)},{k:"_ac",l:"ACWR",t:"calc",f:r=>r._p.a==null?"—":f2(r._p.a),cor:r=>corAcwr(r._p.a)}]}/>`}
  </div>`;
}
/* ---------- Fisiologia ---------- */
function SeletorDia({d,set}){
  return html`<div class="seg"><button aria-label="Dia anterior" onClick=${()=>set(addDias(d,-1))}>‹</button><input type="date" id="dia-sel" class="seg-date" value=${d} onInput=${e=>e.target.value&&set(e.target.value)}/><button onClick=${()=>set(hoje())} class=${d===hoje()?"on":""}>Hoje</button><button aria-label="Próximo dia" onClick=${()=>set(addDias(d,1))}>›</button></div>`;
}
function SelAtleta({st,v,set,id,todos}){
  return html`<select class="field" id=${id} style=${{width:"auto",minWidth:"180px"}} value=${v} onChange=${e=>set(e.target.value)}>${todos?html`<option value="">Todos os atletas</option>`:null}${st.elenco.map(j=>html`<option key=${j.id} value=${j.id}>${j.nome}</option>`)}</select>`;
}
function Fisiologia({st,up,toast}){
  const [aba,setAba]=useAba("fisio","Dashboard"); const [d,setD]=useState(hoje());
  const [a1,setA1]=useState(()=>st.elenco[0]?.id||""); const [a2,setA2]=useState(()=>st.elenco[1]?.id||"");
  const psr=crud(up,"psr"), pse=crud(up,"pse"), cmj=crud(up,"cmj"), gps=crud(up,"gps");
  const at=ativos(st).filter(j=>(j.saude||"Liberado")!=="Não liberado");
  const doDia=l=>l.filter(r=>r.data===d);
  const lancar=(api,lista,extra)=>{ const ja=new Set(lista.filter(r=>r.data===d).map(r=>r.atleta)); const novos=at.filter(j=>!ja.has(j.id)).map(j=>({data:d,atleta:j.id,...extra})); if(!novos.length){toast("Todos os atletas já estão na lista deste dia");return;} api.addMany(novos); toast(novos.length+" atletas adicionados para "+fmtD(d)); };
  const respPre=doDia(st.psr).filter(p=>n(p.recup)!=null||n(p.sono)!=null).length, respPos=doDia(st.pse).filter(p=>n(p.pse)!=null).length;
  const prs=at.map(j=>prontidao(st,j).sc).filter(x=>x!=null);
  const risco=at.filter(j=>{const p=prontidao(st,j);return (p.a!=null&&p.a>1.5)||(p.sc!=null&&p.sc<55);});
  const cargaDia=ultimosDias(14,d).map(x=>({x:fmtD(x),y:sum(st.pse.filter(p=>p.data===x).map(p=>(n(p.pse)||0)*(n(p.min)||0)))||null}));
  const carga=r=>{const v=(n(r.pse)||0)*(n(r.min)||0);return v?Math.round(v):"—";};
  const hist=id=>{ const ds=ultimosDias(28,d); return {
    rec:ds.map(x=>({x:fmtD(x),y:avg(st.psr.filter(p=>p.atleta===id&&p.data===x).map(p=>n(p.recup)))})),
    car:ds.map(x=>({x:fmtD(x),y:sum(st.pse.filter(p=>p.atleta===id&&p.data===x).map(p=>(n(p.pse)||0)*(n(p.min)||0)))||null})),
    cm:st.cmj.filter(c=>c.atleta===id&&c.data).sort((a,b)=>a.data.localeCompare(b.data)).slice(-12).map(c=>({x:fmtD(c.data),y:n(c.cm)})) }; };
  const medGps=id=>{ const r=st.gps.filter(g=>g.atleta===id); return {dist:avg(r.map(g=>n(g.dist))),hsr:avg(r.map(g=>n(g.hsr))),spr:avg(r.map(g=>n(g.sprints))),vmax:Math.max(0,...r.map(g=>n(g.vmax)||0))||null,acel:avg(r.map(g=>n(g.acel)))}; };
  return html`<div class="grid" style=${{gap:"14px"}}>
    <div class="toolbar" style=${{marginBottom:0,justifyContent:"space-between"}}><${Abas} tabs=${["Dashboard","Pré-treino (PSR)","Pós-treino (PSE)","Salto (CMJ)","GPS","Comparação GPS","Minutagem","Histórico"]} v=${aba} set=${setAba}/><${SeletorDia} d=${d} set=${setD}/></div>
    ${aba==="Dashboard"?html`<div class="grid" style=${{gap:"14px"}}>
      <div class="grid g-kpi">
        <${Kpi} l="Pré-treino" v=${`${respPre}/${at.length}`} d=${"respostas em "+fmtD(d)}/>
        <${Kpi} l="Prontidão média" v=${prs.length?Math.round(avg(prs))+"%":"—"} d="último PSR de cada atleta"/>
        <${Kpi} l="Pós-treino (PSE)" v=${`${respPos}/${at.length}`} d=${"respostas em "+fmtD(d)}/>
        <${Kpi} l="Em risco" v=${risco.length} d=${risco.length?risco.slice(0,3).map(j=>j.nome).join(", "):"ACWR > 1,5 ou prontidão < 55"}/>
      </div>
      <div class="card"><div class="card-h"><div><h2>Carga da equipe</h2><p>Soma de PSE × minutos por dia · últimos 14 dias</p></div></div><${Serie} pts=${cargaDia} fmt=${v=>Math.round(v)}/></div>
      <div class="note">Fluxo do dia: em “Pré-treino” toque em “Lançar elenco do dia” e preencha o bem-estar; depois do treino faça o mesmo em “Pós-treino” com a PSE (0–10) e os minutos.</div>
    </div>`:null}
    ${aba==="Pré-treino (PSR)"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>lancar(psr,st.psr,{sono:"",fadiga:"",dor:"",regiao:"",humor:"",recup:""})}>${I.plus}Lançar elenco do dia</button><button class="btn ro-hide" onClick=${()=>psr.add({data:d,atleta:""})}>${I.plus}Um atleta</button><span class="note">Escala 1–10. Sono, humor e recuperação: quanto maior, melhor. Fadiga e dor: quanto maior, pior.</span></div>
      <${Tabela} st=${st} rows=${doDia(st.psr)} api=${psr} vazio=${"Nenhum PSR em "+fmtD(d)+"."} cols=${[{k:"atleta",l:"Atleta",t:"atleta"},{k:"sono",l:"Sono",t:"num",w:"48px"},{k:"fadiga",l:"Fadiga",t:"num",w:"48px"},{k:"dor",l:"Dor",t:"num",w:"48px"},{k:"regiao",l:"Região da dor",w:"120px"},{k:"humor",l:"Humor",t:"num",w:"48px"},{k:"recup",l:"Recup.",t:"num",w:"48px"},{k:"_p",l:"Prontidão",t:"calc",f:r=>{const j=atl(st,r.atleta);return j?(prontidao(st,j).sc??"—"):"—";},cor:r=>{const j=atl(st,r.atleta);return corPront(j?prontidao(st,j).sc:null);}}]}/>
    </div>`:null}
    ${aba==="Pós-treino (PSE)"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>lancar(pse,st.pse,{pse:"",min:""})}>${I.plus}Lançar elenco do dia</button><button class="btn ro-hide" onClick=${()=>pse.add({data:d,atleta:""})}>${I.plus}Um atleta</button><span class="note">Carga = PSE (0–10) × minutos. ACWR = carga dos últimos 7 dias ÷ média semanal dos últimos 28.</span></div>
      <${Tabela} st=${st} rows=${doDia(st.pse)} api=${pse} vazio=${"Nenhuma PSE em "+fmtD(d)+"."} cols=${[{k:"atleta",l:"Atleta",t:"atleta"},{k:"pse",l:"PSE",t:"num",w:"48px"},{k:"min",l:"Minutos",t:"num",w:"60px"},{k:"_c",l:"Carga",t:"calc",f:carga},{k:"_a",l:"ACWR",t:"calc",f:r=>{const a=acwr(st,r.atleta,d);return a==null?"—":f2(a);},cor:r=>corAcwr(acwr(st,r.atleta,d))}]}/>
    </div>`:null}
    ${aba==="Salto (CMJ)"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>lancar(cmj,st.cmj,{cm:""})}>${I.plus}Lançar elenco do dia</button><${SelAtleta} st=${st} v=${a1} set=${setA1} id="cmj-at"/></div>
      <div class="card"><div class="card-h"><div><h2>CMJ · ${nomeA(st,a1)}</h2><p>Altura do salto (cm) nas últimas avaliações</p></div></div><${Serie} pts=${hist(a1).cm} tipo="linha" cor="var(--info)"/></div>
      <${Tabela} st=${st} rows=${doDia(st.cmj)} api=${cmj} vazio=${"Nenhum CMJ em "+fmtD(d)+"."} cols=${[{k:"atleta",l:"Atleta",t:"atleta"},{k:"cm",l:"Altura (cm)",t:"num"},{k:"_v",l:"Var. vs média",t:"calc",f:r=>{const m=avg(st.cmj.filter(c=>c.atleta===r.atleta&&c.id!==r.id).map(c=>n(c.cm)));return m&&n(r.cm)?((n(r.cm)-m)/m*100).toFixed(1)+"%":"—";},cor:r=>{const m=avg(st.cmj.filter(c=>c.atleta===r.atleta&&c.id!==r.id).map(c=>n(c.cm)));return m&&n(r.cm)&&(n(r.cm)-m)/m<-0.08?"var(--bad)":"var(--fg)";}}]}/>
    </div>`:null}
    ${aba==="GPS"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>lancar(gps,st.gps,{dist:"",hsr:"",sprints:"",vmax:"",acel:""})}>${I.plus}Lançar elenco do dia</button><span class="note">Distância total e alta intensidade em metros; velocidade máxima em km/h.</span></div>
      <${Tabela} st=${st} rows=${doDia(st.gps)} api=${gps} vazio=${"Nenhum GPS em "+fmtD(d)+"."} cols=${[{k:"atleta",l:"Atleta",t:"atleta"},{k:"dist",l:"Distância (m)",t:"num",w:"70px"},{k:"hsr",l:"Alta int. (m)",t:"num",w:"64px"},{k:"sprints",l:"Sprints",t:"num",w:"52px"},{k:"vmax",l:"V. máx",t:"num",w:"52px"},{k:"acel",l:"Acel.",t:"num",w:"52px"}]}/>
    </div>`:null}
    ${aba==="Comparação GPS"?html`<div class="card">
      <div class="card-h"><div><h2>Comparação GPS</h2><p>Médias de todos os registros de cada atleta</p></div><div class="actions"><${SelAtleta} st=${st} v=${a1} set=${setA1} id="cmp-a"/><${SelAtleta} st=${st} v=${a2} set=${setA2} id="cmp-b"/></div></div>
      ${[["dist","Distância (m)"],["hsr","Alta intensidade (m)"],["spr","Sprints"],["vmax","Vel. máx (km/h)"],["acel","Acelerações"]].map(([k,l])=>{ const x=medGps(a1)[k], y=medGps(a2)[k], mx=Math.max(x||0,y||0)||1;
        return html`<div key=${k} class="cmp"><span class="note">${l}</span><div class="cmp-b"><b class="num">${x==null?"—":Math.round(x)}</b><${Barra} v=${x} max=${mx} cor="var(--red)"/></div><div class="cmp-b"><b class="num">${y==null?"—":Math.round(y)}</b><${Barra} v=${y} max=${mx} cor="var(--info)"/></div></div>`; })}
      <div class="legend" style=${{marginTop:"8px"}}><span><i style=${{background:"var(--red)"}}></i>${nomeA(st,a1)}</span><span><i style=${{background:"var(--info)"}}></i>${nomeA(st,a2)}</span></div>
    </div>`:null}
    ${aba==="Minutagem"?html`<div class="card"><div class="card-h"><div><h2>Minutagem da temporada</h2><p>% dos minutos disponíveis, lançado na Gestão de Elenco. Acima de 50% = titular absoluto; 25–50% = rotação.</p></div></div>
      <div class="dist">${st.elenco.filter(j=>n(j.minutos)!=null).sort((a,b)=>n(b.minutos)-n(a.minutos)).map(j=>html`<div key=${j.id} class="dist-r"><span>${j.nome}</span><${Barra} v=${n(j.minutos)} cor=${n(j.minutos)>50?"var(--red)":n(j.minutos)>=25?"var(--warn)":"var(--mute)"}/><b class="num">${n(j.minutos)}%</b></div>`)}
      ${!st.elenco.some(j=>n(j.minutos)!=null)?html`<div class="empty">Nenhuma minutagem lançada. Preencha “% Min” na Gestão de Elenco.</div>`:null}</div></div>`:null}
    ${aba==="Histórico"?html`<div class="grid" style=${{gap:"14px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><${SelAtleta} st=${st} v=${a1} set=${setA1} id="hist-a"/><span class="note">Últimos 28 dias até ${fmtD(d)}</span></div>
      <div class="grid g-2">
        <div class="card"><div class="card-h"><div><h2>Recuperação</h2><p>PSR 1–10</p></div></div><${Serie} pts=${hist(a1).rec} tipo="linha" ymin=${0} ymax=${10} cor="var(--good)"/></div>
        <div class="card"><div class="card-h"><div><h2>Carga diária</h2><p>PSE × minutos</p></div></div><${Serie} pts=${hist(a1).car} fmt=${v=>Math.round(v)}/></div>
      </div>
    </div>`:null}
  </div>`;
}

/* ---------- Fisioterapia ---------- */
const LES_TIPO = ["Muscular","Ligamentar","Articular","Óssea","Tendínea","Contusão","Outra"];
const LES_GRAU = ["Leve","Moderada","Grave"];
const ATD_ST = ["Em tratamento","Liberado","Encaminhado"];
function Fisioterapia({st,up}){
  const [aba,setAba]=useAba("fisioterapia","Painel clínico"); const [q,setQ]=useState("");
  const atd=crud(up,"atend"), les=crud(up,"lesoes");
  const setJ=(id,k,v)=>up(s=>({...s, elenco:s.elenco.map(j=>j.id===id?{...j,[k]:v}:j)}));
  const at=ativos(st); const c=k=>at.filter(j=>(j.saude||"Liberado")===k).length;
  const ativasL=st.lesoes.filter(l=>l.status!=="Recuperado");
  const diasFora=l=>l.data?diasEntre(l.data,l.status==="Recuperado"&&l.retorno?l.retorno:hoje()):null;
  const novas7=st.lesoes.filter(l=>l.data&&diasEntre(l.data,hoje())>=0&&diasEntre(l.data,hoje())<7).length;
  const filtro=r=>!q||nomeA(st,r.atleta).toLowerCase().includes(q.toLowerCase());
  const grupos=[["Crítico","Não liberado"],["Em transição","Em transição"],["Lib. c/ observação","Sob observação"],["Apto","Liberado"]];
  const contar=(lista,k)=>Object.entries(lista.reduce((o,l)=>{const x=l[k]||"Não informado";o[x]=(o[x]||0)+1;return o;},{})).sort((a,b)=>b[1]-a[1]);
  return html`<div class="grid" style=${{gap:"14px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Críticos" v=${c("Não liberado")}/><${Kpi} l="Lib. c/ observação" v=${c("Sob observação")}/><${Kpi} l="Aptos" v=${c("Liberado")}/>
      <${Kpi} l="Média de dias fora" v=${ativasL.length?Math.round(avg(ativasL.map(diasFora))):"—"} d="lesões em aberto"/><${Kpi} l="Novas lesões 7d" v=${novas7}/>
    </div>
    <div class="toolbar" style=${{marginBottom:0}}><${Abas} tabs=${["Painel clínico","Atendimentos","Lesões","Estatísticas"]} v=${aba} set=${setAba}/><input class="field grow" id="busca-fisio" placeholder="Buscar atleta" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
    ${aba==="Painel clínico"?html`<div class="grid g-2">${grupos.map(([t,k])=>{ const js=at.filter(j=>(j.saude||"Liberado")===k&&(!q||j.nome.toLowerCase().includes(q.toLowerCase())));
      return html`<section class="posbox" key=${k}><header><b style=${{color:SAUDE_COR[k]}}>${t}</b><span class="chip">${js.length}</span></header>
        <ul>${js.map(j=>{ const l=ativasL.find(x=>x.atleta===j.id); return html`<li key=${j.id}><span class="av" style=${{borderColor:SAUDE_COR[k]}}>${iniciais(j.nome)}</span>
          <div style=${{minWidth:0}}><div class="nm">${j.nome}</div><div class="meta">${POSN[j.pos]?.s}${l?` · ${l.tipo||"lesão"} ${l.regiao||""} · ${diasFora(l)} dias`:""}</div></div>
          <select class="cell end" id=${"cl-"+j.id} style=${{width:"auto",maxWidth:"150px",color:SAUDE_COR[j.saude||"Liberado"],fontWeight:600}} value=${j.saude||"Liberado"} onChange=${e=>setJ(j.id,"saude",e.target.value)}>${SAUDE.map(v=>html`<option key=${v}>${v}</option>`)}</select></li>`; })}
        ${!js.length?html`<li class="note">Nenhum atleta nesta categoria</li>`:null}</ul></section>`; })}</div>`:null}
    ${aba==="Atendimentos"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>atd.add({data:hoje(),atleta:"",queixa:"",regiao:"",conduta:"",status:"Em tratamento"})}>${I.plus}Novo atendimento</button></div>
      <${Tabela} st=${st} rows=${st.atend.filter(filtro).sort((a,b)=>(b.data||"").localeCompare(a.data||""))} api=${atd} vazio="Nenhum atendimento registrado." cols=${[{k:"data",l:"Data",t:"date"},{k:"atleta",l:"Atleta",t:"atleta"},{k:"queixa",l:"Queixa",w:"150px"},{k:"regiao",l:"Região",w:"110px"},{k:"conduta",l:"Conduta",w:"180px"},{k:"status",l:"Status",t:"select",opts:ATD_ST}]}/>
    </div>`:null}
    ${aba==="Lesões"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>les.add({data:hoje(),atleta:"",tipo:"Muscular",regiao:"",grau:"Leve",retorno:"",status:"Ativa"})}>${I.plus}Registrar lesão</button><span class="note">Ao registrar, ajuste o status médico do atleta no Painel clínico.</span></div>
      <${Tabela} st=${st} rows=${st.lesoes.filter(filtro).sort((a,b)=>(b.data||"").localeCompare(a.data||""))} api=${les} vazio="Nenhuma lesão registrada." cols=${[{k:"data",l:"Data",t:"date"},{k:"atleta",l:"Atleta",t:"atleta"},{k:"tipo",l:"Tipo",t:"select",opts:LES_TIPO},{k:"regiao",l:"Região",w:"110px"},{k:"grau",l:"Grau",t:"select",opts:LES_GRAU,w:"90px"},{k:"retorno",l:"Retorno previsto",t:"date"},{k:"status",l:"Status",t:"select",opts:["Ativa","Recuperado"],cor:v=>v==="Ativa"?"var(--bad)":"var(--good)"},{k:"_d",l:"Dias fora",t:"calc",f:r=>diasFora(r)??"—"}]}/>
    </div>`:null}
    ${aba==="Estatísticas"?html`<div class="grid g-2">
      <div class="card"><div class="card-h"><div><h2>Lesões por região</h2><p>${st.lesoes.length} registros</p></div></div><div class="dist">${contar(st.lesoes,"regiao").map(([k,v])=>html`<div key=${k} class="dist-r"><span>${k}</span><${Barra} v=${v} max=${Math.max(1,...contar(st.lesoes,"regiao").map(x=>x[1]))}/><b class="num">${v}</b></div>`)}${!st.lesoes.length?html`<p class="note">Sem lesões registradas.</p>`:null}</div></div>
      <div class="card"><div class="card-h"><div><h2>Lesões por tipo</h2><p>Média de ${st.lesoes.length?Math.round(avg(st.lesoes.map(diasFora))):"—"} dias fora</p></div></div><div class="dist">${contar(st.lesoes,"tipo").map(([k,v])=>html`<div key=${k} class="dist-r"><span>${k}</span><${Barra} v=${v} max=${Math.max(1,...contar(st.lesoes,"tipo").map(x=>x[1]))} cor="var(--warn)"/><b class="num">${v}</b></div>`)}${!st.lesoes.length?html`<p class="note">Sem lesões registradas.</p>`:null}</div></div>
    </div>`:null}
  </div>`;
}

/* ---------- Preparação Física ---------- */
const SES_TIPO = ["Campo","Academia","Regenerativo","Tático","Técnico","Jogo","Folga"];
const INTENS = ["Baixa","Média","Alta","Máxima"];
const INT_COR = {"Baixa":"var(--good)","Média":"var(--info)","Alta":"var(--warn)","Máxima":"var(--bad)"};
const FASES = ["Fase 1 · Clínica","Fase 2 · Reabilitação funcional","Fase 3 · Transição em campo","Fase 4 · Treino com o grupo"];
function PrepFisica({st,up,toast}){
  const [aba,setAba]=useAba("prep","Microciclo semanal");
  const seg=d=>addDias(d,-((new Date(d+"T12:00:00").getDay()+6)%7));
  const [ini,setIni]=useState(()=>seg(hoje()));
  const ses=crud(up,"sessoes"), mod=crud(up,"modelos");
  const setJ=(id,k,v)=>up(s=>({...s, elenco:s.elenco.map(j=>j.id===id?{...j,[k]:v}:j)}));
  const dias=Array.from({length:7},(_,i)=>addDias(ini,i));
  const at=ativos(st), disp=at.filter(j=>(j.saude||"Liberado")==="Liberado").length;
  const [modeloSel,setModeloSel]=useState("");
  const usarModelo=d=>{ const m=st.modelos.find(x=>x.id===modeloSel); if(!m){toast("Escolha um modelo da Base de sessões");return;} const {id,...r}=m; ses.add({...r,data:d}); toast("Sessão adicionada em "+fmtD(d)); };
  return html`<div class="grid" style=${{gap:"14px"}}>
    <${Abas} tabs=${["Microciclo semanal","Base de sessões","Lesões","Transição"]} v=${aba} set=${setAba}/>
    ${aba==="Microciclo semanal"?html`<div class="grid" style=${{gap:"12px"}}>
      <div class="toolbar" style=${{marginBottom:0,justifyContent:"space-between"}}>
        <div class="seg"><button onClick=${()=>setIni(addDias(ini,-7))}>‹</button><button class="on">${fmtD(dias[0])} — ${fmtD(dias[6])}</button><button onClick=${()=>setIni(addDias(ini,7))}>›</button><button onClick=${()=>setIni(seg(hoje()))}>Esta semana</button></div>
        <div class="actions ro-hide"><select class="field" id="modelo-sel" style=${{width:"auto"}} value=${modeloSel} onChange=${e=>setModeloSel(e.target.value)}><option value="">Modelo de sessão…</option>${st.modelos.map(m=>html`<option key=${m.id} value=${m.id}>${m.titulo||m.tipo}</option>`)}</select></div>
      </div>
      <div class="micro">${dias.map(d=>{ const ss=st.sessoes.filter(x=>x.data===d); return html`<div key=${d} class=${"micro-d"+(d===hoje()?" hoje":"")}>
        <div class="micro-h"><span>${SEMANA[new Date(d+"T12:00:00").getDay()]}</span><b>${Number(d.slice(8))}</b><span class="chip" style=${{color:"var(--good)"}}>${disp}/${at.length}</span></div>
        ${ss.map(x=>html`<div key=${x.id} class="micro-s" style=${{borderLeftColor:INT_COR[x.intensidade]||"var(--line2)"}}>
          <input class="cell" id=${"st-"+x.id} value=${x.titulo||""} placeholder="Sessão" onInput=${e=>ses.set(x.id,"titulo",e.target.value)} style=${{fontWeight:600}}/>
          <div style=${{display:"flex",gap:"4px"}}><select class="cell" id=${"stp-"+x.id} value=${x.tipo} onChange=${e=>ses.set(x.id,"tipo",e.target.value)}>${SES_TIPO.map(t=>html`<option key=${t}>${t}</option>`)}</select><input class="cell n" id=${"smin-"+x.id} value=${x.min||""} placeholder="min" onInput=${e=>ses.set(x.id,"min",e.target.value)} style=${{width:"46px"}}/></div>
          <div style=${{display:"flex",gap:"4px",alignItems:"center"}}><select class="cell" id=${"sint-"+x.id} value=${x.intensidade} onChange=${e=>ses.set(x.id,"intensidade",e.target.value)} style=${{color:INT_COR[x.intensidade],fontWeight:600}}>${INTENS.map(t=>html`<option key=${t}>${t}</option>`)}</select><${Del} onYes=${()=>ses.del(x.id)}/></div>
          <input class="cell" id=${"sf-"+x.id} value=${x.foco||""} placeholder="Foco" onInput=${e=>ses.set(x.id,"foco",e.target.value)}/>
        </div>`)}
        <div class="ro-hide" style=${{display:"flex",gap:"4px"}}><button class="btn sm" style=${{flex:1,justifyContent:"center"}} onClick=${()=>ses.add({data:d,titulo:"",tipo:"Campo",min:"",intensidade:"Média",foco:""})}>${I.plus}</button>${modeloSel?html`<button class="btn sm" onClick=${()=>usarModelo(d)}>Modelo</button>`:null}</div>
      </div>`; })}</div>
      <div class="card"><div class="card-h"><div><h2>Volume da semana</h2><p>Minutos planejados por dia</p></div></div><${Serie} pts=${dias.map(d=>({x:SEMANA[new Date(d+"T12:00:00").getDay()],y:sum(st.sessoes.filter(x=>x.data===d).map(x=>x.min))||null}))} fmt=${v=>Math.round(v)}/></div>
    </div>`:null}
    ${aba==="Base de sessões"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>mod.add({titulo:"",tipo:"Campo",foco:"",min:"",intensidade:"Média"})}>${I.plus}Novo modelo</button><span class="note">Modelos prontos para usar no microciclo.</span></div>
      <${Tabela} st=${st} rows=${st.modelos} api=${mod} vazio="Nenhum modelo de sessão. Crie modelos como “Força MMII”, “Regenerativo pós-jogo”, “Tático 11×11”." cols=${[{k:"titulo",l:"Título",w:"180px"},{k:"tipo",l:"Tipo",t:"select",opts:SES_TIPO},{k:"foco",l:"Foco",w:"160px"},{k:"min",l:"Minutos",t:"num"},{k:"intensidade",l:"Intensidade",t:"select",opts:INTENS,cor:v=>INT_COR[v]}]}/>
    </div>`:null}
    ${aba==="Lesões"?html`<div class="card"><div class="card-h"><div><h2>Lesões em aberto</h2><p>Registradas na Fisioterapia</p></div></div>
      ${st.lesoes.filter(l=>l.status!=="Recuperado").length?html`<div class="alerts">${st.lesoes.filter(l=>l.status!=="Recuperado").map(l=>html`<div key=${l.id} class="alert bad"><div><b>${nomeA(st,l.atleta)} · ${l.tipo} ${l.regiao||""}</b><span>Desde ${fmtD(l.data)} · ${l.grau||""}${l.retorno?" · retorno previsto "+fmtD(l.retorno):""}</span></div></div>`)}</div>`:html`<p class="note">Nenhuma lesão em aberto.</p>`}</div>`:null}
    ${aba==="Transição"?html`<div class="card"><div class="card-h"><div><h2>Retorno progressivo</h2><p>Atletas com status “Em transição”</p></div></div>
      ${at.filter(j=>j.saude==="Em transição").length?html`<div class="alerts">${at.filter(j=>j.saude==="Em transição").map(j=>{ const f=FASES.indexOf(j.fase||FASES[0]); return html`<div key=${j.id} class="need" style=${{flexWrap:"wrap"}}>
        <span class="av">${iniciais(j.nome)}</span><div style=${{flex:"1 1 160px",minWidth:0}}><b>${j.nome}</b><${Barra} v=${f+1} max=${4} cor="var(--info)"/></div>
        <select class="cell" id=${"fase-"+j.id} style=${{width:"auto"}} value=${j.fase||FASES[0]} onChange=${e=>setJ(j.id,"fase",e.target.value)}>${FASES.map(x=>html`<option key=${x}>${x}</option>`)}</select>
        <button class="btn sm ro-hide" onClick=${()=>setJ(j.id,"saude","Liberado")}>Liberar</button></div>`; })}</div>`
      :html`<p class="note">Nenhum atleta em transição. Mude o status médico na Fisioterapia ou no Elenco.</p>`}</div>`:null}
  </div>`;
}

/* ---------- Nutrição ---------- */
function Nutricao({st,up}){
  const [aba,setAba]=useAba("nutri","Dashboard"); const [a,setA]=useState(()=>st.elenco[0]?.id||"");
  const nu=crud(up,"nutri"), hi=crud(up,"hidrat"), pl=crud(up,"planos");
  const ult=st.elenco.map(j=>ultimo(st.nutri,j.id)).filter(Boolean);
  const perda=r=>n(r.pesoPre)&&n(r.pesoPos)?((n(r.pesoPre)-n(r.pesoPos))/n(r.pesoPre)*100):null;
  const corPerda=v=>v==null?"var(--fg)":v>2?"var(--bad)":v>1?"var(--warn)":"var(--good)";
  const mm=r=>n(r.peso)&&n(r.gordura)!=null?f1(n(r.peso)*(1-n(r.gordura)/100)):"—";
  return html`<div class="grid" style=${{gap:"14px"}}>
    <${Abas} tabs=${["Dashboard","Composição corporal","Plano alimentar","Hidratação","Controle de peso"]} v=${aba} set=${setAba}/>
    ${aba==="Dashboard"?html`<div class="grid g-kpi">
      <${Kpi} l="Atletas avaliados" v=${ult.length} d=${`de ${st.elenco.length} no elenco`}/>
      <${Kpi} l="% gordura média" v=${f1(avg(ult.map(r=>n(r.gordura))))} u="%" d="última avaliação de cada atleta"/>
      <${Kpi} l="Peso médio" v=${f1(avg(ult.map(r=>n(r.peso))))} u="kg"/>
      <${Kpi} l="Perda hídrica média" v=${f1(avg(st.hidrat.map(perda)))} u="%" d="ideal abaixo de 2%"/>
    </div>`:null}
    ${aba==="Composição corporal"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>nu.add({data:hoje(),atleta:"",peso:"",gordura:"",obs:""})}>${I.plus}Nova avaliação</button></div>
      <${Tabela} st=${st} rows=${st.nutri.slice().sort((x,y)=>(y.data||"").localeCompare(x.data||""))} api=${nu} vazio="Nenhuma avaliação registrada. Toque em “Nova avaliação” para começar." cols=${[{k:"data",l:"Data",t:"date"},{k:"atleta",l:"Atleta",t:"atleta"},{k:"peso",l:"Peso (kg)",t:"num"},{k:"gordura",l:"% gordura",t:"num"},{k:"_mm",l:"Massa magra (kg)",t:"calc",f:mm},{k:"obs",l:"Observação",w:"160px"}]}/>
    </div>`:null}
    ${aba==="Plano alimentar"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>pl.add({atleta:"",kcal:"",prot:"",carb:"",gord:"",obs:""})}>${I.plus}Novo plano</button></div>
      <${Tabela} st=${st} rows=${st.planos} api=${pl} vazio="Nenhum plano alimentar cadastrado." cols=${[{k:"atleta",l:"Atleta",t:"atleta"},{k:"kcal",l:"Kcal/dia",t:"num",w:"70px"},{k:"prot",l:"Proteína (g)",t:"num"},{k:"carb",l:"Carbo (g)",t:"num"},{k:"gord",l:"Gordura (g)",t:"num"},{k:"obs",l:"Orientações",w:"220px"}]}/>
    </div>`:null}
    ${aba==="Hidratação"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>hi.add({data:hoje(),atleta:"",pesoPre:"",pesoPos:"",ingest:""})}>${I.plus}Novo registro</button><span class="note">Perda = (peso pré − pós) ÷ pré. Acima de 2% indica desidratação.</span></div>
      <${Tabela} st=${st} rows=${st.hidrat.slice().sort((x,y)=>(y.data||"").localeCompare(x.data||""))} api=${hi} vazio="Nenhum registro de hidratação." cols=${[{k:"data",l:"Data",t:"date"},{k:"atleta",l:"Atleta",t:"atleta"},{k:"pesoPre",l:"Peso pré (kg)",t:"num"},{k:"pesoPos",l:"Peso pós (kg)",t:"num"},{k:"ingest",l:"Ingestão (L)",t:"num"},{k:"_p",l:"Perda",t:"calc",f:r=>{const v=perda(r);return v==null?"—":f1(v)+"%";},cor:r=>corPerda(perda(r))}]}/>
    </div>`:null}
    ${aba==="Controle de peso"?html`<div class="card"><div class="card-h"><div><h2>Evolução · ${nomeA(st,a)}</h2><p>Peso e % de gordura nas avaliações</p></div><${SelAtleta} st=${st} v=${a} set=${setA} id="peso-a"/></div>
      <div class="grid g-2"><${Serie} tipo="linha" pts=${st.nutri.filter(r=>r.atleta===a&&r.data).sort((x,y)=>x.data.localeCompare(y.data)).map(r=>({x:fmtD(r.data),y:n(r.peso)}))} ymin=${null}/><${Serie} tipo="linha" cor="var(--warn)" pts=${st.nutri.filter(r=>r.atleta===a&&r.data).sort((x,y)=>x.data.localeCompare(y.data)).map(r=>({x:fmtD(r.data),y:n(r.gordura)}))}/></div></div>`:null}
  </div>`;
}
/* ---------- Painel de Inteligência (kanban) ---------- */
const COLS = [["A fazer","var(--info)"],["Em andamento","var(--warn)"],["Revisão","#9b7bff"],["Concluído","var(--good)"]];
const PRIO = ["Alta","Média","Baixa"]; const PRIO_COR={"Alta":"var(--bad)","Média":"var(--warn)","Baixa":"var(--mute)"};
function Inteligencia({st,up}){
  const tf=crud(up,"tarefas");
  const sem=st.tarefas.filter(t=>t.col==="Concluído"&&t.feito&&diasEntre(t.feito,hoje())<7).length;
  const mover=(t,k)=>{ const i=COLS.findIndex(c=>c[0]===t.col)+k; if(i<0||i>=COLS.length) return; const col=COLS[i][0]; up(s=>({...s,tarefas:s.tarefas.map(x=>x.id===t.id?{...x,col,feito:col==="Concluído"?hoje():""}:x)})); };
  return html`<div class="grid" style=${{gap:"14px"}}>
    <div class="grid g-kpi"><${Kpi} l="Total de tarefas" v=${st.tarefas.length}/><${Kpi} l="Em andamento" v=${st.tarefas.filter(t=>t.col==="Em andamento").length}/><${Kpi} l="Concluídas na semana" v=${sem}/></div>
    <div class="kanban">${COLS.map(([c,cor])=>{ const ts=st.tarefas.filter(t=>(t.col||"A fazer")===c); return html`<section key=${c} class="kcol" style=${{borderTopColor:cor}}>
      <header><b style=${{color:cor}}>${c}</b><span class="chip">${ts.length}</span><button class="x ro-hide" style=${{marginLeft:"auto"}} aria-label=${"Nova tarefa em "+c} onClick=${()=>tf.add({titulo:"",resp:"",prazo:"",prio:"Média",col:c})}>${I.plus}</button></header>
      ${ts.map(t=>html`<div key=${t.id} class="kcard">
        <textarea class="cell" id=${"tt-"+t.id} rows="2" placeholder="Descreva a tarefa" value=${t.titulo} onInput=${e=>tf.set(t.id,"titulo",e.target.value)}></textarea>
        <div style=${{display:"flex",gap:"4px"}}><input class="cell" id=${"tr-"+t.id} placeholder="Responsável" value=${t.resp} onInput=${e=>tf.set(t.id,"resp",e.target.value)}/><input class="cell" type="date" id=${"tp-"+t.id} value=${t.prazo} onInput=${e=>tf.set(t.id,"prazo",e.target.value)} style=${{maxWidth:"130px",color:t.prazo&&t.prazo<hoje()&&c!=="Concluído"?"var(--bad)":"inherit"}}/></div>
        <div style=${{display:"flex",gap:"4px",alignItems:"center"}}><select class="cell" id=${"tpr-"+t.id} value=${t.prio} onChange=${e=>tf.set(t.id,"prio",e.target.value)} style=${{color:PRIO_COR[t.prio],fontWeight:600,width:"auto"}}>${PRIO.map(p=>html`<option key=${p}>${p}</option>`)}</select>
          <span style=${{marginLeft:"auto",display:"flex",gap:"2px"}} class="ro-hide"><button class="x" aria-label="Voltar" onClick=${()=>mover(t,-1)}>‹</button><button class="x" aria-label="Avançar" onClick=${()=>mover(t,1)}>›</button></span><${Del} onYes=${()=>tf.del(t.id)}/></div>
      </div>`)}
      ${!ts.length?html`<p class="note" style=${{textAlign:"center",padding:"18px 0"}}>Nenhuma tarefa</p>`:null}
    </section>`; })}</div>
  </div>`;
}

/* ---------- Mercado ---------- */
const NIVEIS = [["Elite",1.2],["Alto Nível",1.1],["Divisões Profissionais",1],["Semi-Profissional e Base",0.88],["Amador",0.72],["Futebol Base",0.6]];
const NIVEL_M = Object.fromEntries(NIVEIS);
const TAGS = ["Lista A","Lista B","Lista C","Mercado Inverno","Mercado Verão","U23","U21","Emprestado","Radar Urgente","Em Observação","Favorito","Arquivado"];
const overall = a => { const b=n(a.base); if(b==null) return null; return Math.min(99,Math.round(b*(NIVEL_M[a.nivel||"Divisões Profissionais"]||1))); };
const corOv = v => v==null?"var(--faint)":v>=75?"var(--good)":v>=65?"var(--warn)":"var(--mute)";
function Mercado({st,up,toast}){
  const [aba,setAba]=useAba("mercado","Dashboard");
  const [q,setQ]=useState(""); const [fp,setFp]=useState(""); const [fn_,setFn]=useState(""); const [ft,setFt]=useState(""); const [ord,setOrd]=useState("ov");
  const al=crud(up,"alvos");
  const novo=()=>{ al.add({nome:"",pos:"ATA",posEsp:"",nasc:"",clube:"",nivel:"Divisões Profissionais",base:"",tec:"",forc:"",vel:"",res:"",tags:"",salario:"",prioridade:"Média",status:"Monitorando",obs:""}); setAba("Cadastro"); toast("Novo atleta no topo da tabela de cadastro"); };
  const tagsDe=a=>String(a.tags||"").split(",").map(s=>s.trim()).filter(Boolean);
  const lista=st.alvos.filter(a=>(!fp||a.pos===fp)&&(!fn_||a.nivel===fn_)&&(!ft||tagsDe(a).includes(ft))&&(!q||[a.nome,a.clube].join(" ").toLowerCase().includes(q.toLowerCase())))
    .sort((a,b)=>ord==="nome"?(a.nome||"").localeCompare(b.nome||""):ord==="idade"?(n(b.nasc)||0)-(n(a.nasc)||0):(overall(b)??-1)-(overall(a)??-1));
  const [cmp,setCmp]=useState([]);
  const pool=[...st.alvos.map(a=>({id:a.id,nome:a.nome||"(sem nome)",pos:a.pos,orig:"Mercado"})),...st.elenco.map(j=>({id:j.id,nome:j.nome,pos:j.pos,orig:"Elenco"}))];
  const setSombra=(pos,i,v)=>up(s=>{ const arr=[...((s.sombra||{})[pos]||["","",""])]; arr[i]=v; return {...s,sombra:{...(s.sombra||{}),[pos]:arr}}; });
  const ATR=[["tec","Técnico"],["forc","Força"],["vel","Velocidade"],["res","Resistência"]];
  return html`<div class="grid" style=${{gap:"14px"}}>
    <div class="toolbar" style=${{marginBottom:0,justifyContent:"space-between"}}><${Abas} tabs=${["Dashboard","Cadastro","Comparação","Equipe sombra"]} v=${aba} set=${setAba}/><button class="btn primary ro-hide" onClick=${novo}>${I.plus}Adicionar jogador</button></div>
    ${aba==="Dashboard"||aba==="Cadastro"?html`<div class="toolbar" style=${{marginBottom:0}}>
      <input class="field grow" id="busca-merc" placeholder="Buscar jogador ou clube" value=${q} onInput=${e=>setQ(e.target.value)}/>
      <select class="field" id="m-pos" style=${{width:"auto"}} value=${fp} onChange=${e=>setFp(e.target.value)}><option value="">Todas as posições</option>${POS.map(p=>html`<option key=${p.k} value=${p.k}>${p.s}</option>`)}</select>
      <select class="field" id="m-niv" style=${{width:"auto"}} value=${fn_} onChange=${e=>setFn(e.target.value)}><option value="">Todos os níveis</option>${NIVEIS.map(([x])=>html`<option key=${x}>${x}</option>`)}</select>
      <select class="field" id="m-tag" style=${{width:"auto"}} value=${ft} onChange=${e=>setFt(e.target.value)}><option value="">Todas as tags</option>${[...new Set([...TAGS,...st.alvos.flatMap(tagsDe)])].map(t=>html`<option key=${t}>${t}</option>`)}</select>
      <select class="field" id="m-ord" style=${{width:"auto"}} value=${ord} onChange=${e=>setOrd(e.target.value)}><option value="ov">Ordenar: overall</option><option value="nome">Ordenar: nome</option><option value="idade">Ordenar: idade</option></select>
    </div>`:null}
    ${aba==="Dashboard"?html`<div>
      <p class="note">${st.alvos.length} jogadores no mercado · ${st.alvos.filter(a=>a.status==="Em negociação").length} em negociação · ${st.alvos.filter(a=>a.status==="Fechado").length} fechados · ${st.alvos.filter(a=>(overall(a)||0)>=75).length} acima de 75</p>
      ${lista.length?html`<div class="acards">${lista.map(a=>{ const ov=overall(a); return html`<div key=${a.id} class="acard">
        <div style=${{display:"flex",gap:"10px",alignItems:"center"}}><span class="av" style=${{width:"42px",height:"42px"}}>${iniciais(a.nome)}</span><div style=${{minWidth:0}}><div class="nm" style=${{fontSize:"15px"}}>${a.nome||"(sem nome)"}</div><div class="meta">${POSN[a.pos]?.s}${a.posEsp?" ("+a.posEsp+")":""} · ${a.clube||"clube não informado"}${n(a.nasc)?" · "+(new Date().getFullYear()-n(a.nasc))+" anos":""}</div></div></div>
        <div class="acard-f"><div><span class="note">Overall</span><b class="num" style=${{color:corOv(ov),fontSize:"26px"}}>${ov??"—"}</b></div><div><span class="note">Nível</span><b style=${{fontSize:"12px"}}>${a.nivel||"—"}</b></div><div><span class="note">Situação</span><b style=${{fontSize:"12px",color:ALVO_COR[a.status]}}>${a.status}</b></div></div>
        <div class="atr">${ATR.map(([k,l])=>html`<div key=${k}><span class="note">${l}</span><${Barra} v=${n(a[k])} cor="var(--info)"/></div>`)}</div>
        ${tagsDe(a).length?html`<div style=${{display:"flex",gap:"4px",flexWrap:"wrap"}}>${tagsDe(a).map(t=>html`<span key=${t} class="chip">${t}</span>`)}</div>`:null}
      </div>`; })}</div>`:html`<div class="empty">Nenhum jogador no mercado. Toque em “Adicionar jogador”.</div>`}
    </div>`:null}
    ${aba==="Cadastro"?html`<div class="grid" style=${{gap:"8px"}}>
      <p class="note" style=${{margin:0}}>Overall = nota base (0–100) × multiplicador do nível da competição: Elite ×1,2 · Alto Nível ×1,1 · Profissional ×1 · Semi-pro ×0,88 · Amador ×0,72 · Base ×0,6. Tags separadas por vírgula.</p>
      <${Tabela} st=${st} rows=${lista} api=${al} vazio="Nenhum jogador cadastrado." cols=${[{k:"nome",l:"Nome",w:"150px"},{k:"pos",l:"Posição",t:"select",opts:POS.map(p=>p.k),w:"70px"},{k:"posEsp",l:"Pos. esp.",w:"70px",ph:"LCB, CAM"},{k:"nasc",l:"Nasc.",t:"num"},{k:"clube",l:"Clube",w:"120px"},{k:"nivel",l:"Nível",t:"select",opts:NIVEIS.map(x=>x[0]),w:"150px"},{k:"base",l:"Nota base",t:"num",w:"52px"},{k:"_ov",l:"Overall",t:"calc",f:r=>overall(r)??"—",cor:r=>corOv(overall(r))},{k:"tec",l:"Téc.",t:"num",w:"44px"},{k:"forc",l:"Força",t:"num",w:"44px"},{k:"vel",l:"Vel.",t:"num",w:"44px"},{k:"res",l:"Resist.",t:"num",w:"44px"},{k:"tags",l:"Tags",w:"140px",ph:"Lista A, U23"},{k:"salario",l:"Salário (R$)",t:"num",w:"80px"},{k:"status",l:"Situação",t:"select",opts:ALVO_ST,cor:v=>ALVO_COR[v]},{k:"obs",l:"Observação",w:"160px"}]}/>
    </div>`:null}
    ${aba==="Comparação"?html`<div class="card">
      <div class="card-h"><div><h2>Comparação</h2><p>Escolha até 3 jogadores do mercado</p></div>
        <div class="actions">${[0,1,2].map(i=>html`<select key=${i} class="field" id=${"cmp-"+i} style=${{width:"auto"}} value=${cmp[i]||""} onChange=${e=>{const c=[...cmp];c[i]=e.target.value;setCmp(c);}}><option value="">Jogador ${i+1}…</option>${st.alvos.map(a=>html`<option key=${a.id} value=${a.id}>${a.nome||"(sem nome)"}</option>`)}</select>`)}</div></div>
      ${cmp.filter(Boolean).length?[["_ov","Overall"],...ATR].map(([k,l])=>{ const cores=["var(--red)","var(--info)","var(--warn)"];
        return html`<div key=${k} class="cmp" style=${{gridTemplateColumns:"110px repeat(3,minmax(0,1fr))"}}><span class="note">${l}</span>${[0,1,2].map(i=>{ const a=st.alvos.find(x=>x.id===cmp[i]); const v=a?(k==="_ov"?overall(a):n(a[k])):null; return html`<div key=${i} class="cmp-b"><b class="num">${v??"—"}</b><${Barra} v=${v} cor=${cores[i]}/></div>`; })}</div>`; })
        :html`<div class="empty">Selecione jogadores acima para comparar.</div>`}
    </div>`:null}
    ${aba==="Equipe sombra"?html`<div class="card"><div class="card-h"><div><h2>Equipe sombra</h2><p>Até 3 opções por posição, do elenco ou do mercado</p></div></div>
      <div class="pitch">${POS.map(p=>html`<section key=${p.k} class="posbox"><header><b>${p.n}</b></header><ul>${[0,1,2].map(i=>html`<li key=${i}><span class="chip">${i+1}º</span>
        <select class="cell" id=${"sb-"+p.k+i} value=${((st.sombra||{})[p.k]||[])[i]||""} onChange=${e=>setSombra(p.k,i,e.target.value)}><option value="">—</option>${pool.filter(x=>x.pos===p.k).map(x=>html`<option key=${x.id} value=${x.id}>${x.nome} · ${x.orig}</option>`)}</select></li>`)}</ul></section>`)}</div></div>`:null}
  </div>`;
}

/* ---------- Análise de desempenho ---------- */
function AnaliseDesemp({st,up,toast}){
  const [aba,setAba]=useAba("desemp","Adversários");
  const ad=crud(up,"adversarios"), jg=crud(up,"jogos");
  const setEsc=a=>(img,erro)=>{ if(erro){toast(erro);return;} ad.set(a.id,"escudo",img); };
  const js=st.jogos.filter(j=>n(j.gp)!=null&&n(j.gc)!=null).sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  const v=js.filter(j=>n(j.gp)>n(j.gc)).length, e=js.filter(j=>n(j.gp)===n(j.gc)).length, d=js.length-v-e;
  return html`<div class="grid" style=${{gap:"14px"}}>
    <${Abas} tabs=${["Adversários","Calendário","Estatística de jogos"]} v=${aba} set=${setAba}/>

      ${st.adversarios.length?html`<div class="acards">${st.adversarios.map(a=>html`<div key=${a.id} class="acard">
        <div style=${{display:"flex",gap:"8px",alignItems:"center"}}><${ClubMark} t=${{...a,sigla:a.sigla||iniciais(a.nome)||"?"}} onSet=${setEsc(a)}/><input class="cell" id=${"adn-"+a.id} placeholder="Nome do clube" value=${a.nome} onInput=${e2=>ad.set(a.id,"nome",e2.target.value)} style=${{fontWeight:700,fontSize:"15px"}}/><${Del} onYes=${()=>ad.del(a.id)}/></div>
        <div style=${{display:"flex",gap:"6px"}}><input class="cell" id=${"ads-"+a.id} placeholder="Sigla" value=${a.sigla} onInput=${e2=>ad.set(a.id,"sigla",e2.target.value.toUpperCase().slice(0,4))} style=${{width:"70px"}}/><input class="cell" id=${"adsis-"+a.id} placeholder="Sistema (ex.: 4-3-3)" value=${a.sistema} onInput=${e2=>ad.set(a.id,"sistema",e2.target.value)}/></div>
        <label class="note">Pontos fortes<textarea class="cell" rows="2" id=${"adf-"+a.id} value=${a.fortes} onInput=${e2=>ad.set(a.id,"fortes",e2.target.value)}></textarea></label>
        <label class="note">Pontos fracos<textarea class="cell" rows="2" id=${"adfr-"+a.id} value=${a.fracos} onInput=${e2=>ad.set(a.id,"fracos",e2.target.value)}></textarea></label>
        <div class="meta">${st.jogos.filter(j=>j.adversario===a.nome).length} jogo(s) registrados</div>
      </div>`)}</div>`:html`<div class="empty">Nenhum adversário cadastrado. Adicione clubes para analisar suas equipes.</div>`}
    </div>`:null}
    ${aba==="Calendário"?html`<div class="grid" style=${{gap:"10px"}}>
      <div class="toolbar" style=${{marginBottom:0}}><button class="btn primary ro-hide" onClick=${()=>jg.add({data:hoje(),adversario:"",competicao:st.config.competicao,mando:"Casa",gp:"",gc:"",xg:"",xga:"",posse:"",fin:""})}>${I.plus}Adicionar jogo</button></div>
      <${Tabela} st=${st} rows=${st.jogos.slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""))} api=${jg} vazio="Nenhum jogo registrado." cols=${[{k:"data",l:"Data",t:"date"},{k:"adversario",l:"Adversário",t:"select",opts:st.adversarios.map(a=>a.nome).filter(Boolean),vazio:true,w:"140px"},{k:"competicao",l:"Competição",w:"100px"},{k:"mando",l:"Mando",t:"select",opts:["Casa","Fora","Neutro"],w:"80px"},{k:"gp",l:"Gols pró",t:"num",w:"44px"},{k:"gc",l:"Gols contra",t:"num",w:"44px"},{k:"xg",l:"xG",t:"num",w:"48px"},{k:"xga",l:"xGA",t:"num",w:"48px"},{k:"posse",l:"Posse %",t:"num",w:"48px"},{k:"fin",l:"Finaliz.",t:"num",w:"44px"},{k:"_r",l:"Resultado",t:"calc",f:r=>n(r.gp)==null||n(r.gc)==null?"—":n(r.gp)>n(r.gc)?"V":n(r.gp)<n(r.gc)?"D":"E",cor:r=>n(r.gp)>n(r.gc)?"var(--good)":n(r.gp)<n(r.gc)?"var(--bad)":"var(--warn)"}]}/>
    </div>`:null}
    ${aba==="Estatística de jogos"?html`<div class="grid" style=${{gap:"14px"}}>
      <div class="grid g-kpi"><${Kpi} l="Jogos" v=${js.length}/><${Kpi} l="V · E · D" v=${`${v}·${e}·${d}`}/><${Kpi} l="Aproveitamento" v=${js.length?Math.round((v*3+e)/(js.length*3)*100)+"%":"—"}/><${Kpi} l="Gols pró · contra" v=${`${sum(js.map(j=>j.gp))}·${sum(js.map(j=>j.gc))}`}/><${Kpi} l="xG médio" v=${f2(avg(js.map(j=>n(j.xg))))} d=${"xGA "+f2(avg(js.map(j=>n(j.xga))))}/></div>

      </div>
    </div>`:null}
  </div>`;
}

/* ---------- Cartões ---------- */
function Cartoes({st,up}){

/* ---------- Contratos ---------- */
const fimContrato = c => { const t=String(c||"").trim(); if(/^\d{4}$/.test(t)) return t+"-12-31"; if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return t; const m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m?`${m[3]}-${m[2]}-${m[1]}`:null; };
function situacaoContrato(c){
  const f=fimContrato(c); if(!f) return {k:"Sem data",cor:"var(--faint)",dias:null};
  const d=diasEntre(hoje(),f);
  if(d<0) return {k:"Expirado",cor:"var(--faint)",dias:d};
  if(d<90) return {k:"Crítico (<3m)",cor:"var(--bad)",dias:d};
  if(d<183) return {k:"Atenção (3–6m)",cor:"var(--warn)",dias:d};
  return {k:"OK (>6m)",cor:"var(--good)",dias:d};
}
function Contratos({st,up}){
  const [aba,setAba]=useAba("contratos","Jogadores"); const [q,setQ]=useState("");
  const setJ=(key)=>(id,k,v)=>up(s=>({...s,[key]:s[key].map(j=>j.id===id?{...j,[k]:v}:j)}));
  const linhas=(lista,key,papel)=>lista.filter(x=>!q||(x.nome||"").toLowerCase().includes(q.toLowerCase())).map(x=>({...x,_s:situacaoContrato(x.contrato),_key:key,_papel:papel(x)}));
  const jog=linhas(st.elenco,"elenco",j=>POSN[j.pos]?.s), stf=linhas(st.comissao,"comissao",c=>c.funcao);
  const atual=aba==="Jogadores"?jog:aba==="Staff"?stf:[...jog,...stf].filter(x=>x._s.k!=="OK (>6m)");
  const cont=k=>atual.filter(x=>x._s.k===k).length;
  return html`<div class="grid" style=${{gap:"14px"}}>
    <${Abas} tabs=${["Jogadores","Staff","Alertas e renovações"]} v=${aba} set=${setAba}/>
    <div class="grid g-kpi"><${Kpi} l="Total" v=${atual.length}/><${Kpi} l="OK (mais de 6 meses)" v=${cont("OK (>6m)")}/><${Kpi} l="Atenção (3–6 meses)" v=${cont("Atenção (3–6m)")}/><${Kpi} l="Crítico (menos de 3 meses)" v=${cont("Crítico (<3m)")}/><${Kpi} l="Expirado" v=${cont("Expirado")} d=${cont("Sem data")+" sem data"}/></div>

    ${atual.length?html`<div class="tablewrap"><table><thead><tr><th>Nome</th><th>Função / posição</th><th>Término (ano ou data)</th><th class="r">Dias restantes</th><th>Situação</th></tr></thead><tbody>
      ${atual.sort((a,b)=>(a._s.dias??99999)-(b._s.dias??99999)).map(x=>html`<tr key=${x._key+x.id}><td style=${{fontWeight:600,padding:"8px"}}>${x.nome||"(sem nome)"}</td><td class="note">${x._papel}</td>
        <td><input class="cell" id=${"ctr-"+x.id} value=${x.contrato||""} placeholder="2026 ou 2026-12-31" onInput=${e=>setJ(x._key)(x.id,"contrato",e.target.value)} style=${{width:"150px"}}/></td>
        <td class="r num">${x._s.dias==null?"—":x._s.dias}</td><td><${Chip} txt=${x._s.k} cor=${x._s.cor}/></td></tr>`)}
    </tbody></table></div>`:html`<div class="empty">${aba==="Staff"?"Nenhum profissional cadastrado. Cadastre a comissão técnica primeiro.":"Nada para mostrar."}</div>`}
  </div>`;
}

    {t:"Elenco 2026", d:`${p.elenco.length} atletas com idade, vínculo, salário, minutagem e decisão 2027.`, go:()=>xlsx(`Elenco2026_SantaCruz_${hoje}.xlsx`,[["Elenco 2026",p.elenco]])},
    {t:"Planejamento 2027", d:`Decisões por atleta e ${p.alvos.length} alvo(s) de mercado.`, go:()=>xlsx(`Planejamento2027_SantaCruz_${hoje}.xlsx`,[["Decisões",p.elenco.map(r=>({"Atleta":r["Atleta"],"Posição":r["Posição"],"Idade em 2027":r["Idade"]!==null?r["Idade"]+1:null,"Contrato até":r["Contrato até"],"Decisão 2027":r["Decisão 2027"]}))],["Alvos 2027",p.alvos],["Comissão 2027",p.comissao.map(c=>({"Profissional":c["Profissional"],"Função":c["Função"],"Contrato até":c["Contrato até"],"Situação 2027":c["Situação 2027"]}))]])},
    {t:"Benchmark Série C", d:"As 12 campanhas de acesso de 2023 a 2025.", go:()=>xlsx(`BenchmarkSerieC_${hoje}.xlsx`,[["Benchmark Série C",p.bench]])},
  ];
  const importar=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.elenco) throw 0; up(migrar(s)); toast("Backup restaurado"); }catch(err){ toast("Arquivo inválido: use um backup .json do Scout Pro"); } }; r.readAsText(f); e.target.value=""; };
  const [reset,setReset]=useState(false);
  return html`<div class="grid" style=${{gap:"16px"}}>
    
    <div class="grid g-2">${itens.map(it=>html`<div class="card" key=${it.t} style=${{display:"flex",gap:"14px",alignItems:"flex-start"}}>
      <span class="av" style=${{width:"42px",height:"42px",borderRadius:"8px",color:"var(--good)",borderColor:"var(--line2)"}}>${I.sheet}</span>
      <div style=${{flex:1,minWidth:0}}><h2 style=${{fontSize:"18px"}}>${it.t}</h2><p class="note" style=${{margin:"4px 0 12px"}}>${it.d}</p>
        <button class=${"btn"+(it.main?" primary":"")} disabled=${busy} onClick=${it.go}>${I.export}Baixar .xlsx</button></div>
    </div>`)}</div>
    <div class="card ro-hide">
      <div class="card-h"><div><h2>Backup e restauração</h2><p>Guarde uma cópia de todo o trabalho ou volte aos dados do documento original</p></div></div>
      <div class="actions">
        <button class="btn" disabled=${busy} onClick=${()=>salvar(`ScoutPro_backup_${hoje}.json`,JSON.stringify(st,null,2))}>${I.export}Baixar backup .json</button>
        <button class="btn" onClick=${()=>fileRef.current.click()}>Restaurar backup</button>
        <input type="file" id="imp" accept=".json,application/json" ref=${fileRef} hidden onChange=${importar}/>
        ${reset?html`<span class="confirm"><button class="btn primary" onClick=${()=>{up(padrao());setReset(false);toast("Dados do planejamento original restaurados")}}>Apagar edições e restaurar</button><button class="btn ghost" onClick=${()=>setReset(false)}>Cancelar</button></span>`
               :html`<button class="btn ghost" onClick=${()=>setReset(true)}>Restaurar dados do documento</button>`}
      </div>
    </div>
  </div>`;
}
