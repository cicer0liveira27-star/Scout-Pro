<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<title>Scout Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sala de análise — trilho lateral fixo com o escudo, área de trabalho em painéis; no celular vira barra de abas inferior */
:root{
  --bg:#0e1012; --panel:#16191c; --panel2:#1d2125; --line:#2a3036; --line2:#353c43;
  --fg:#eceef0; --mute:#8b939b; --faint:#5d656d;
  --red:#e3262c; --red-ink:#ff4a4f; --red-soft:rgba(227,38,44,.14);
  --good:#2fb36b; --warn:#e3a62b; --bad:#ff5a5f; --info:#5b95ff;
  --st-rem:#5b95ff; --st-con:#2fb36b; --st-base:#e3a62b; --st-emp:#e3262c;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f3f4; --panel:#ffffff; --panel2:#f3f4f6; --line:#dfe2e6; --line2:#cfd4d9;
  --fg:#14171a; --mute:#59616a; --faint:#8c949c;
  --red:#cc151b; --red-ink:#c3121a; --red-soft:rgba(204,21,27,.09);
  --good:#1d8f52; --warn:#b77d0c; --bad:#d23338; --info:#2f6fe0;
  --st-rem:#2f6fe0; --st-con:#1d8f52; --st-base:#b77d0c; --st-emp:#cc151b;
  --shadow:0 1px 2px rgba(20,23,26,.06), 0 6px 18px rgba(20,23,26,.05);
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f2f3f4; --panel:#ffffff; --panel2:#f3f4f6; --line:#dfe2e6; --line2:#cfd4d9;
  --fg:#14171a; --mute:#59616a; --faint:#8c949c;
  --red:#cc151b; --red-ink:#c3121a; --red-soft:rgba(204,21,27,.09);
  --good:#1d8f52; --warn:#b77d0c; --bad:#d23338; --info:#2f6fe0;
  --st-rem:#2f6fe0; --st-con:#1d8f52; --st-base:#b77d0c; --st-emp:#cc151b;
  --shadow:0 1px 2px rgba(20,23,26,.06), 0 6px 18px rgba(20,23,26,.05);
  color-scheme:light;
}
/* Temas escolhidos no app (classe no body, independente do tema do sistema) */
body.t-dark{--bg:#0e1012;--panel:#16191c;--panel2:#1d2125;--line:#2a3036;--line2:#353c43;--fg:#eceef0;--mute:#8b939b;--faint:#5d656d;--red:#e3262c;--red-ink:#ff4a4f;--red-soft:rgba(227,38,44,.14);--good:#2fb36b;--warn:#e3a62b;--bad:#ff5a5f;--info:#5b95ff;--st-rem:#5b95ff;--st-con:#2fb36b;--st-base:#e3a62b;--st-emp:#e3262c;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
body.t-light{--bg:#f2f3f4;--panel:#fff;--panel2:#f3f4f6;--line:#dfe2e6;--line2:#cfd4d9;--fg:#14171a;--mute:#59616a;--faint:#8c949c;--red:#cc151b;--red-ink:#c3121a;--red-soft:rgba(204,21,27,.09);--good:#1d8f52;--warn:#b77d0c;--bad:#d23338;--info:#2f6fe0;--st-rem:#2f6fe0;--st-con:#1d8f52;--st-base:#b77d0c;--st-emp:#cc151b;--shadow:0 1px 2px rgba(20,23,26,.06),0 6px 18px rgba(20,23,26,.05);color-scheme:light}
body.t-black{--bg:#000;--panel:#000;--panel2:#0c0c0c;--line:#1c1c1c;--line2:#2a2a2a;--fg:#f4f4f4;--mute:#8c8c8c;--faint:#555;--red:#e3262c;--red-ink:#ff4d52;--red-soft:rgba(227,38,44,.15);--good:#3cc47a;--warn:#e8b13a;--bad:#ff5a5f;--info:#6ea2ff;--st-rem:#6ea2ff;--st-con:#3cc47a;--st-base:#e8b13a;--st-emp:#e3262c;--shadow:none;color-scheme:dark}
body.t-black .card,body.t-black .tablewrap,body.t-black .posbox{border-color:#1f1f1f}
body.t-black th{background:#080808}
.themes{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;width:100%}
.themes button{flex:1;border:0;background:transparent;padding:6px 4px;font-size:11px;cursor:pointer;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.themes button i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line2)}
.themes button.on{background:var(--panel2);color:var(--fg);font-weight:600}
body.ro .money,body.ro .ro-hide{display:none!important}
body.ro .cell{pointer-events:none}
body.ro select.cell{appearance:none;-webkit-appearance:none}
.lock{display:flex;flex-direction:column;gap:6px;font-size:12px}
.lock b{font-weight:600;color:var(--fg);word-break:break-all}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal form{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.err{color:var(--bad);font-size:12px}
.mtheme{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:22px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .logo{width:40px;height:40px;flex:none}
.client{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.client img{width:26px;height:auto}
.client b{display:block;font-size:12px}
.client span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.crest{width:26px;height:26px;object-fit:contain;flex:none}
.club.up{cursor:pointer}
.club img{width:100%;height:100%;object-fit:contain}
.club.has{background:transparent;border-color:transparent}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em;line-height:1}
.brand b em{font-style:normal;color:var(--red-ink)}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--mute);text-decoration:none;font-weight:500;position:relative}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--panel2);color:var(--fg)}
.nav a.on{background:var(--red-soft);color:var(--fg)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--red);border-radius:0 2px 2px 0}
.nav .tag{margin-left:auto;font-size:10px;font-family:var(--f-mono);color:var(--red-ink);border:1px solid var(--red);border-radius:3px;padding:0 4px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:8px;padding:0 6px}

.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.online i,.sync.nuvem i{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent);animation:pulse 2s infinite}
.sync.salvando i{background:var(--warn)}
.sync.erro i{background:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-ink);font-weight:600}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.2vw,44px);line-height:1;letter-spacing:.01em;margin:4px 0 0;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.sub{color:var(--mute);margin:6px 0 0;max-width:68ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.5;cursor:default}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--mute);font-size:12px}
.span2{grid-column:1/-1}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1}
.kpi .v small{font-size:16px;color:var(--mute);font-weight:600;margin-left:3px}
.kpi .d{font-size:12px;color:var(--mute)}
.kpi .d b{font-weight:600}
.up{color:var(--bad)} .ok{color:var(--good)} .wn{color:var(--warn)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block;overflow:visible}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)} .alert.good{border-left-color:var(--good)}
.alert b{display:block;font-size:13px}
.alert span{color:var(--mute);font-size:12px}
.chip{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line2);white-space:nowrap}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px;min-width:0}
.field{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
.field:focus{border-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--fg);font-weight:600}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
td.r,th.r{text-align:right}
.cell{background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 6px;width:100%;min-width:0}
.cell:hover{border-color:var(--line2)}
.cell:focus{border-color:var(--red);background:var(--panel2);outline:none}
.cell.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
select.cell{cursor:pointer}
.w-name{min-width:150px}
.stbar{width:4px;padding:0!important}
.stbar i{display:block;width:4px;height:28px;border-radius:2px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--panel2);border:2px solid var(--line2);flex:none}

.pitch{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.posbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.posbox header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.posbox header b{font-family:var(--f-display);font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.posbox ul{list-style:none;margin:0;padding:6px}
.posbox li{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:6px}
.posbox li .nm{font-weight:600;font-size:13px;line-height:1.2}
.posbox li .meta{color:var(--mute);font-size:11px;font-family:var(--f-mono)}
.posbox li .end{margin-left:auto;text-align:right}
.dim{opacity:.5}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.club{display:inline-grid;place-items:center;width:34px;height:26px;overflow:hidden;border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.04em;background:var(--panel2);border:1px solid var(--line2);flex:none}

.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:10px}
.note{font-size:12px;color:var(--mute)}
.need{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel2)}
.need .big{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--red-ink);min-width:34px;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);border-radius:4px}
.bar.over i{background:var(--bad)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:4px}
.x{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:5px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--red-soft)}
.x svg{width:15px;height:15px}

.mobile-tabs{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .mobile-tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mobile-tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:10.5px;color:var(--mute);text-decoration:none;font-weight:500}
  .mobile-tabs a svg{width:20px;height:20px}
  .mobile-tabs a.on{color:var(--red-ink)}
  .kpi .v{font-size:32px}
}
@media (min-width:861px){ .mhead{display:none} }
.mhead .brand .logo{width:32px;height:32px}
.mhead .brand b{font-size:20px}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){

const n = v => { if(v===""||v===null||v===undefined) return null; const x = typeof v==="number"?v:parseFloat(String(v).replace(",",".")); return isFinite(x)?x:null; };
const avg = a => { const b=a.filter(x=>x!==null&&x!==undefined&&isFinite(x)); return b.length? b.reduce((s,x)=>s+x,0)/b.length : null; };
const sum = a => a.reduce((s,x)=>s+(n(x)||0),0);
const f1 = v => v===null||v===undefined ? "—" : v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const f2 = v => v===null||v===undefined ? "—" : v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const idade = (j,ano) => n(j.nasc)!==null ? ano - n(j.nasc) : null;
const iniciais = s => (s||"?").replace(/[^\p{L}\s]/gu,"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
function pearson(xs,ys){ const m=xs.length; if(m<3) return null; const mx=avg(xs),my=avg(ys); let a=0,b=0,c=0; for(let i=0;i<m;i++){const dx=xs[i]-mx,dy=ys[i]-my;a+=dx*dy;b+=dx*dx;c+=dy*dy;} return b&&c? a/Math.sqrt(b*c):null; }
function regress(xs,ys){ const mx=avg(xs),my=avg(ys); let a=0,b=0; xs.forEach((x,i)=>{a+=(x-mx)*(ys[i]-my);b+=(x-mx)**2}); const s=b?a/b:0; return {s, i:my-s*mx}; }

function lerEscudo(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error("imagem")); img.onload=()=>{ const S=96, w=img.naturalWidth||S, h=img.naturalHeight||S, k=Math.min(S/w,S/h); const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k)); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/png")); }; img.src=fr.result; }; fr.readAsDataURL(file); }); }
function baixarArquivo(filename,data){ const blob = data instanceof Blob ? data : new Blob([data],{type:"application/octet-stream"}); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
const rTxt = r => r===null?"—": (Math.abs(r)>=.7?"forte":Math.abs(r)>=.4?"moderada":"fraca");

function porPos(lista, ano){
  const o={}; POS.forEach(p=>o[p.k]={qtd:0,idades:[]});
  lista.forEach(j=>{ if(!o[j.pos]) return; o[j.pos].qtd++; const i=idade(j,ano); if(i!==null) o[j.pos].idades.push(i); });
  POS.forEach(p=>o[p.k].idade=avg(o[p.k].idades));
  return o;
}

/* ---------- Persistência: banco compartilhado (tempo real) com fallback local ---------- */
const LS_KEY = "scoutpro.estado.v1";
function lerLocal(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function gravarLocal(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
function migrar(s){ const d=padrao(); if(!s||typeof s!=="object") return d; return {...d, ...s, bench:Array.isArray(s.bench)?s.bench:d.bench, elenco:Array.isArray(s.elenco)?s.elenco:d.elenco, alvos:Array.isArray(s.alvos)?s.alvos:[], comissao:Array.isArray(s.comissao)?s.comissao:[], decisoes:s.decisoes||{}}; }

const FBV = "https://www.gstatic.com/firebasejs/10.12.2/";
// Na nuvem pública, valores financeiros ficam num documento separado que só editores leem.
function separar(s){
  const sal={};
  const tira=arr=>(arr||[]).map(x=>{ if(x.salario!==""&&x.salario!=null) sal[x.id]=x.salario; return {...x,salario:""}; });
  return { pub:{...s, elenco:tira(s.elenco), comissao:tira(s.comissao), alvos:tira(s.alvos), orc2026:"", orc2027:""},
           priv:{sal, orc2026:s.orc2026||"", orc2027:s.orc2027||""} };
}
function juntar(pub,priv){
  if(!priv) return pub;
  const f=arr=>(arr||[]).map(x=>({...x, salario: priv.sal&&priv.sal[x.id]!=null ? priv.sal[x.id] : x.salario}));
  return {...pub, elenco:f(pub.elenco), comissao:f(pub.comissao), alvos:f(pub.alvos), orc2026:priv.orc2026||"", orc2027:priv.orc2027||""};
}
const comTempo = (p,ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo")),ms))]);
function useStore(){
  const [state,setState] = useState(()=>migrar(lerLocal()));
  const [sync,setSync] = useState("conectando");
  const [modo,setModo] = useState("conectando"); // nuvem | claude | local
  const [user,setUser] = useState(null);
  const fb = useRef(null), writer = useRef(null), pend = useRef(null), writing = useRef(false), timer = useRef(null);
  const cid = useRef(Math.random().toString(36).slice(2));
  const flush = useRef(null);
  flush.current = async () => {
    if(writing.current || !pend.current || !writer.current) return;
    const s = pend.current; pend.current = null; writing.current = true; setSync("salvando");
    try{ await writer.current(s); setSync("online"); }
    catch(e){ setSync(/grant|writer|denied|permission/i.test((e&&(e.code||e.message))||"") ? "leitura" : "erro"); }
    writing.current = false;
    if(pend.current) flush.current();
  };
  useEffect(()=>{
    let alive = true, unsub = null;
    const meta = () => ({by:cid.current, at:new Date().toISOString()});
    const receber = data => {
      if(!data || data.by===cid.current){ setSync("online"); return; }
      if(pend.current || writing.current) return;
      try{ const s = migrar(JSON.parse(data.json)); setState(s); gravarLocal(s); }catch(e){}
      setSync("online");
    };
    (async()=>{
      const cfg = window.SCOUTPRO_FIREBASE;
      if(cfg && cfg.apiKey && cfg.projectId){
        try{
          const [appM,authM,fsM] = await comTempo(Promise.all([import(FBV+"firebase-app.js"),import(FBV+"firebase-auth.js"),import(FBV+"firebase-firestore.js")]), 10000);
          if(!alive) return;
          const app = appM.initializeApp(cfg), db = fsM.getFirestore(app), auth = authM.getAuth(app);
          fb.current = {authM, auth};
          const pubRef = fsM.doc(db, "scoutpro", "estado"), privRef = fsM.doc(db, "scoutpro_privado", "financeiro");
          let lastPub = null, lastPriv = null, unsubPriv = null;
          const aplicar = () => { if(!lastPub) return; const s = migrar(juntar(lastPub, lastPriv)); setState(s); gravarLocal(s); };
          writer.current = async st => {
            const {pub, priv} = separar(st); const m = meta();
            lastPub = pub; lastPriv = priv;
            await fsM.setDoc(pubRef, {json:JSON.stringify(pub), ...m});
            await fsM.setDoc(privRef, {json:JSON.stringify(priv), ...m});
          };
          const ouvir = (snap, qual) => {
            if(!snap.exists()){ setSync("online"); return; }
            const d = snap.data(); if(d.by===cid.current){ setSync("online"); return; }
            if(pend.current || writing.current) return;
            try{ const v = JSON.parse(d.json); if(qual==="pub") lastPub = v; else lastPriv = v; aplicar(); }catch(e){}
            setSync("online");
          };
          authM.onAuthStateChanged(auth, u => {
            setUser(u ? {email:u.email} : null);
            if(unsubPriv){ unsubPriv(); unsubPriv = null; }
            if(u){ unsubPriv = fsM.onSnapshot(privRef, sn => ouvir(sn,"priv"), () => {}); }
            else { lastPriv = null; aplicar(); }
          });
          setModo("nuvem");
          const u1 = fsM.onSnapshot(pubRef, sn => ouvir(sn,"pub"), () => setSync("erro"));
          unsub = () => { u1(); if(unsubPriv) unsubPriv(); };
          return;
        }catch(e){ console.warn("Firebase indisponível, seguindo sem nuvem", e); }
      }
      let d = null;
      try{ d = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ d = null; }
      if(!alive) return;
      if(!d){ setModo("local"); setSync("local"); return; }
      const ref = d.doc("scout/estado");
      writer.current = st => ref.set({json:JSON.stringify(st), ...meta()});
      setModo("claude");
      unsub = ref.onSnapshot(snap => receber(snap.exists ? snap.data() : null), () => setSync("erro"));
    })();
    return ()=>{ alive=false; if(unsub) unsub(); };
  },[]);
  const update = useCallback(fn=>{
    setState(prev=>{
      const next = typeof fn==="function" ? fn(prev) : fn;
      gravarLocal(next);
      if(writer.current){ pend.current = next; clearTimeout(timer.current); timer.current = setTimeout(()=>flush.current(), 600); }
      return next;
    });
  },[]);
  const entrar = async (email, senha) => { const f=fb.current; if(!f) throw new Error("sem nuvem"); await f.authM.signInWithEmailAndPassword(f.auth, email, senha); };
  const sair = async () => { const f=fb.current; if(f) await f.authM.signOut(f.auth); };
  const podeEditar = modo==="nuvem" ? !!user : (modo!=="conectando" && sync!=="leitura");
  return {state, update, sync, modo, user, entrar, sair, podeEditar};
}

function Login({onClose,entrar}){
  const [email,setEmail]=useState(""); const [senha,setSenha]=useState(""); const [erro,setErro]=useState(""); const [busy,setBusy]=useState(false);
  const enviar=async e=>{ e.preventDefault(); setBusy(true); setErro("");
    try{ await entrar(email.trim(),senha); onClose(true); }
    catch(err){ const c=(err&&err.code)||""; setErro(/invalid|wrong|not-found|credential/.test(c)?"E-mail ou senha incorretos.":/too-many/.test(c)?"Muitas tentativas. Aguarde alguns minutos.":/network/.test(c)?"Sem conexão com o banco.":"Não foi possível entrar ("+(c||"erro")+")."); }
    setBusy(false); };
  return html`<div class="modal" onClick=${e=>{ if(e.target===e.currentTarget) onClose(false); }}>
    <form onSubmit=${enviar}>
      <h2>Entrar como editor</h2>
      <p class="note" style=${{margin:0}}>Visitantes veem o app em modo leitura. Editores alteram os dados de todos em tempo real.</p>
      <label>E-mail<input class="field" id="login-email" type="email" autocomplete="username" required value=${email} onInput=${e=>setEmail(e.target.value)}/></label>
      <label>Senha<input class="field" id="login-senha" type="password" autocomplete="current-password" required value=${senha} onInput=${e=>setSenha(e.target.value)}/></label>
      ${erro?html`<div class="err">${erro}</div>`:null}
      <div class="actions"><button class="btn primary" type="submit" disabled=${busy}>${busy?"Entrando…":"Entrar"}</button><button class="btn ghost" type="button" onClick=${()=>onClose(false)}>Cancelar</button></div>
    </form></div>`;
}

function Kpi({l,v,u,d,cls}){ return html`<div class=${"card kpi "+(cls||"")}><span class="l">${l}</span><span class="v num">${v}${u?html`<small>${u}</small>`:null}</span>${d?html`<span class="d">${d}</span>`:null}</div>`; }
function Delta({a,b,inv,suf=""}){
  if(a===null||b===null) return html`<b>—</b>`;
  const d=a-b, ok = inv ? d<=0 : d>=0;
  const cls = Math.abs(d)<0.05 ? "" : ok ? "ok" : "up";
  return html`<b class=${cls}>${d>0?"+":""}${f1(d)}${suf}</b>`;
}

/* ---------- Painel ---------- */
function Painel({st}){
  const ano=st.temporada;
  const aprov = st.elenco.filter(j=>j.aproveitado);
  const pp = useMemo(()=>porPos(aprov,ano),[st.elenco,ano]);
  const idadeMed = avg(aprov.map(j=>idade(j,ano)));
  const altMed = avg(aprov.map(j=>n(j.alt)));
  const benchIdade = avg(st.bench.map(t=>n(t.idade)));
  const benchUsados = avg(st.bench.map(t=>n(t.usados)));
  const folhaAtl = sum(st.elenco.map(j=>j.salario));
  const folhaCom = sum(st.comissao.map(c=>c.salario));
  const folha = folhaAtl + folhaCom;
  const orc = n(st.orc2026);
  const titulares = st.elenco.filter(j=>n(j.minutos)!==null&&n(j.minutos)>50).length;
  const rotacao = st.elenco.filter(j=>n(j.minutos)!==null&&n(j.minutos)>=25&&n(j.minutos)<=50).length;
  const temMin = st.elenco.some(j=>n(j.minutos)!==null);
  const gols = sum(st.elenco.map(j=>j.gols));

  const alertas = [];
  POS.forEach(p=>{
    const q=pp[p.k].qtd, b=BENCH_QTD[p.k], i=pp[p.k].idade, bi=BENCH_IDADE[p.k];
    if(q < Math.round(b)) alertas.push({t:"bad", h:`${p.n}: ${q} de ${f1(b)} na média`, s:`Faltam ${Math.round(b)-q} atleta(s) para a profundidade dos times que subiram.`});
    if(i!==null && i-bi>=3) alertas.push({t:"warn", h:`${p.n}: idade ${f1(i)} vs ${f1(bi)}`, s:`${f1(i-bi)} anos acima do perfil dos acessos.`});
  });
  if(idadeMed!==null && benchIdade!==null && idadeMed-benchIdade>1) alertas.push({t:"warn", h:`Idade geral ${f1(idadeMed)} vs ${f1(benchIdade)}`, s:"O elenco aproveitado está mais velho que a média dos acessos 2023–2025."});
  if(!alertas.length) alertas.push({t:"good", h:"Elenco dentro do perfil de acesso", s:"Nenhuma posição abaixo da profundidade ou com idade fora da faixa."});

  return html`<div class="grid" style=${{gap:"16px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Atletas aproveitados" v=${aprov.length} d=${html`de ${st.elenco.length} no elenco · média acesso <b>${f1(benchUsados)}</b> utilizados`}/>
      <${Kpi} l="Idade média" v=${f1(idadeMed)} u="anos" d=${html`<${Delta} a=${idadeMed} b=${benchIdade} inv=${true}/> vs ${f1(benchIdade)} dos acessos`}/>

function Del({onYes}){
  const ed=React.useContext(EDIT);
  const [c,setC]=useState(false);
  useEffect(()=>{ if(!c) return; const t=setTimeout(()=>setC(false),3500); return ()=>clearTimeout(t); },[c]);
  if(!ed) return null;
  return c ? html`<span class="confirm"><button class="btn sm primary" onClick=${onYes}>Remover</button><button class="btn sm ghost" onClick=${()=>setC(false)}>Não</button></span>`
           : html`<button class="x" title="Remover" aria-label="Remover" onClick=${()=>setC(true)}>${I.trash}</button>`;
}

function ClubMark({t,onSet}){
  const ref=useRef();

  const body = t.escudo ? html`<img src=${t.escudo} alt=${"Escudo "+t.nome}/>` : t.sigla;

  return html`<span style=${{display:"inline-flex",alignItems:"center",gap:"2px"}}>

/* ---------- Benchmark ---------- */
function Scatter({data,xl,yl,invY}){
  const W=560,H=340,L=46,R=16,Tp=16,B=40;
  const xs=data.map(d=>d.x), ys=data.map(d=>d.y);
  const pad=(a,b)=>{const r=(b-a)||1;return [a-r*.12,b+r*.12]};
  const [x0,x1]=pad(Math.min(...xs),Math.max(...xs)), [y0,y1]=pad(Math.min(...ys),Math.max(...ys));
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R), Y=v=> invY ? Tp+(v-y0)/(y1-y0)*(H-Tp-B) : H-B-(v-y0)/(y1-y0)*(H-Tp-B);
  const reg=regress(xs,ys);
  const nice=(a,b)=>{const st=Math.pow(10,Math.floor(Math.log10((b-a)/4)));const s=[1,2,5,10].map(m=>m*st).find(s=>(b-a)/s<=6)||st*10;const o=[];for(let v=Math.ceil(a/s)*s;v<=b;v+=s)o.push(+v.toFixed(2));return o;};
  const mx=avg(xs), my=avg(ys);
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${xl+" por "+yl}>
    ${nice(x0,x1).map(t=>html`<g key=${"x"+t}><line x1=${X(t)} x2=${X(t)} y1=${Tp} y2=${H-B} stroke="var(--line)"/><text x=${X(t)} y=${H-B+16} text-anchor="middle" font-size="11" fill="var(--mute)">${t}</text></g>`)}
    ${nice(y0,y1).map(t=>html`<g key=${"y"+t}><line x1=${L} x2=${W-R} y1=${Y(t)} y2=${Y(t)} stroke="var(--line)"/><text x=${L-8} y=${Y(t)+4} text-anchor="end" font-size="11" fill="var(--mute)">${t}</text></g>`)}
    <line x1=${X(mx)} x2=${X(mx)} y1=${Tp} y2=${H-B} stroke="var(--mute)" stroke-dasharray="4 4" opacity=".6"/>
    <line x1=${L} x2=${W-R} y1=${Y(my)} y2=${Y(my)} stroke="var(--mute)" stroke-dasharray="4 4" opacity=".6"/>
    <line x1=${X(x0)} y1=${Y(reg.i+reg.s*x0)} x2=${X(x1)} y2=${Y(reg.i+reg.s*x1)} stroke="var(--red)" stroke-width="2" opacity=".8"/>
    ${data.map(d=>html`<g key=${d.label}>${d.esc
      ? html`<circle cx=${X(d.x)} cy=${Y(d.y)} r="13" fill="var(--panel)" stroke="var(--line2)"/><image href=${d.esc} x=${X(d.x)-10} y=${Y(d.y)-10} width="20" height="20" preserveAspectRatio="xMidYMid meet"><title>${d.label}</title></image>`
      : html`<circle cx=${X(d.x)} cy=${Y(d.y)} r="6.5" fill="var(--fg)" stroke="var(--panel)" stroke-width="2"/>
      <text x=${X(d.x)+9} y=${Y(d.y)-7} font-size="10.5" fill="var(--fg)" font-weight="600" style=${{fontFamily:"Barlow Condensed,Arial Narrow,sans-serif",letterSpacing:".04em"}}>${d.label}</text>`}</g>`)}
    <text x=${(L+W-R)/2} y=${H-6} text-anchor="middle" font-size="12" fill="var(--mute)">${xl}</text>
    <text transform=${`translate(12 ${(Tp+H-B)/2}) rotate(-90)`} text-anchor="middle" font-size="12" fill="var(--mute)">${yl}</text>
  </svg>`;
}

function UsoChart({bench}){
  const W=560,H=230,L=34,B=38,Tp=10; const bw=(W-L-10)/bench.length;
  const max=Math.max(50,...bench.map(t=>n(t.usados)||0)); const Y=v=>H-B-v/max*(H-B-Tp);
  const media=avg(bench.map(t=>n(t.usados)));
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Uso do elenco por clube">
    ${[0,10,20,30,40,50].map(t=>html`<g key=${t}><line x1=${L} x2=${W} y1=${Y(t)} y2=${Y(t)} stroke="var(--line)"/><text x=${L-6} y=${Y(t)+4} text-anchor="end" font-size="10.5" fill="var(--mute)">${t}</text></g>`)}
    ${bench.map((t,i)=>{ const x=L+i*bw+bw*.15, w=bw*.7; const u=n(t.usados)||0, ti=n(t.tit)||0, ro=n(t.rot)||0;
      return html`<g key=${t.id}>
        <rect x=${x} y=${Y(u)} width=${w} height=${H-B-Y(u)} rx="2" fill="var(--panel2)" stroke="var(--line2)"/>
        <rect x=${x} y=${Y(ti+ro)} width=${w} height=${H-B-Y(ro)} rx="0" fill="var(--mute)" opacity=".7"/>
        <rect x=${x} y=${Y(ti)} width=${w} height=${H-B-Y(ti)} rx="0" fill="var(--red)"/>

/* ---------- Planilhas ---------- */
function planilhas(st,ed){
  const p=planilhas0(st);
  if(ed) return p;
  const tira=rows=>rows.map(r=>{const o={...r}; delete o["Salário (R$)"]; return o;});
  return {...p, elenco:tira(p.elenco), alvos:tira(p.alvos), comissao:tira(p.comissao)};
}
function planilhas0(st){
  const ano=st.temporada;
  const elenco = st.elenco.map(j=>({"Atleta":j.nome,"Posição":POSN[j.pos]?.s||j.pos,"Nascimento":n(j.nasc),"Idade":idade(j,ano),"Altura (m)":n(j.alt),"Vínculo":j.status,"Aproveitado":j.aproveitado?"Sim":"Não","Salário (R$)":n(j.salario),"Contrato até":n(j.contrato),"% Minutos":n(j.minutos),"Jogos":n(j.jogos),"Gols":n(j.gols),"Assistências":n(j.assist),"Nota":n(j.nota),"Decisão 2027":st.decisoes[j.id]||"Avaliar"}));
  const pp=porPos(st.elenco.filter(j=>j.aproveitado),ano);
  const resumo = POS.map(p=>({"Posição":p.s,"Atletas SC":pp[p.k].qtd,"Média acessos":BENCH_QTD[p.k],"Idade SC":pp[p.k].idade!==null?+pp[p.k].idade.toFixed(1):null,"Idade acessos":BENCH_IDADE[p.k],"Diferença idade":pp[p.k].idade!==null?+(pp[p.k].idade-BENCH_IDADE[p.k]).toFixed(1):null}));
  const bench = st.bench.map(t=>({"Clube":t.nome,"Ano":t.ano,"Jogadores utilizados":n(t.usados),"Idade média":n(t.idade),"+50% minutos":n(t.tit),"25-50% minutos":n(t.rot),">30% participação":n(t.p30),"Total elenco":n(t.total),"Pontos":n(t.pts),"Gols marcados":n(t.gf),"Gols sofridos":n(t.ga),"xG":n(t.xg),"xGA":n(t.xga)}));
  const alvos = st.alvos.map(a=>({"Atleta":a.nome,"Posição":POSN[a.pos]?.s||a.pos,"Nascimento":n(a.nasc),"Idade em 2027":idade(a,2027),"Clube atual":a.clube,"Salário (R$)":n(a.salario),"Prioridade":a.prioridade,"Situação":a.status,"Observação":a.obs}));
  const comissao = st.comissao.map(c=>({"Profissional":c.nome,"Função":c.funcao,"Área":AREA(c.funcao),"Nascimento":n(c.nasc),"Idade":idade(c,ano),"Desde":n(c.desde),"Contrato até":n(c.contrato),"Salário (R$)":n(c.salario),"Situação 2027":c.sit2027,"Observação":c.obs}));
  return {elenco,resumo,bench,alvos,comissao};
}
function Exportar({st,up,toast}){
  const [dl,setDl]=useState(undefined); const [busy,setBusy]=useState(false); const fileRef=useRef();
  useEffect(()=>{ let ok=true; (async()=>{ try{ const d = window.claude&&window.claude.use? await window.claude.use("downloads"):null; if(ok) setDl(d); }catch(e){ if(ok) setDl(null);} })(); return ()=>{ok=false}; },[]);
  const ed=React.useContext(EDIT);
  const p=planilhas(st,ed);
  const salvar=async(filename,data)=>{
    if(!dl){ try{ baixarArquivo(filename,data); toast("Download iniciado: "+filename); }catch(e){ toast("Não foi possível baixar neste navegador"); } return; }
    setBusy(true);
    try{ await dl.save({filename,data}); toast("Arquivo enviado: "+filename); }
    catch(e){ toast(e&&e.code==="declined"?"Download cancelado":"Não foi possível baixar ("+(e&&e.code||"erro")+")"); }
    setBusy(false);
  };
  const xlsx=(nome,abas)=>{
    const wb=XLSX.utils.book_new();
    abas.forEach(([t,rows])=>{ const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"":"Sem dados"}]); const keys=Object.keys(rows[0]||{"":1}); ws["!cols"]=keys.map(k=>({wch:Math.max(10,k.length+2,...rows.map(r=>String(r[k]??"").length+2))})); XLSX.utils.book_append_sheet(wb,ws,t.slice(0,31)); });
    const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    salvar(nome,new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  };
  const hoje=new Date().toISOString().slice(0,10);
  const itens=[
    {t:"Relatório completo", d:"Elenco 2026, comissão técnica, resumo por posição, benchmark Série C e alvos 2027 em abas separadas.", go:()=>xlsx(`ScoutPro_SantaCruz_${hoje}.xlsx`,[["Elenco 2026",p.elenco],["Comissão técnica",p.comissao],["Resumo por posição",p.resumo],["Benchmark Série C",p.bench],["Alvos 2027",p.alvos]]), main:true},
    {t:"Comissão técnica", d:`${p.comissao.length} profissional(is) com função, contrato, salário e situação 2027.`, go:()=>xlsx(`Comissao_SantaCruz_${hoje}.xlsx`,[["Comissão técnica",p.comissao]])},
    {t:"Elenco 2026", d:`${p.elenco.length} atletas com idade, vínculo, salário, minutagem e decisão 2027.`, go:()=>xlsx(`Elenco2026_SantaCruz_${hoje}.xlsx`,[["Elenco 2026",p.elenco]])},
    {t:"Planejamento 2027", d:`Decisões por atleta e ${p.alvos.length} alvo(s) de mercado.`, go:()=>xlsx(`Planejamento2027_SantaCruz_${hoje}.xlsx`,[["Decisões",p.elenco.map(r=>({"Atleta":r["Atleta"],"Posição":r["Posição"],"Idade em 2027":r["Idade"]!==null?r["Idade"]+1:null,"Contrato até":r["Contrato até"],"Decisão 2027":r["Decisão 2027"]}))],["Alvos 2027",p.alvos],["Comissão 2027",p.comissao.map(c=>({"Profissional":c["Profissional"],"Função":c["Função"],"Contrato até":c["Contrato até"],"Situação 2027":c["Situação 2027"]}))]])},
    {t:"Benchmark Série C", d:"As 12 campanhas de acesso de 2023 a 2025.", go:()=>xlsx(`BenchmarkSerieC_${hoje}.xlsx`,[["Benchmark Série C",p.bench]])},
  ];
  const importar=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.elenco) throw 0; up(migrar(s)); toast("Backup restaurado"); }catch(err){ toast("Arquivo inválido: use um backup .json do Scout Pro"); } }; r.readAsText(f); e.target.value=""; };
  const [reset,setReset]=useState(false);
  return html`<div class="grid" style=${{gap:"16px"}}>
    
    <div class="grid g-2">${itens.map(it=>html`<div class="card" key=${it.t} style=${{display:"flex",gap:"14px",alignItems:"flex-start"}}>
      <span class="av" style=${{width:"42px",height:"42px",borderRadius:"8px",color:"var(--good)",borderColor:"var(--line2)"}}>${I.sheet}</span>
      <div style=${{flex:1,minWidth:0}}><h2 style=${{fontSize:"18px"}}>${it.t}</h2><p class="note" style=${{margin:"4px 0 12px"}}>${it.d}</p>
        <button class=${"btn"+(it.main?" primary":"")} disabled=${busy} onClick=${it.go}>${I.export}Baixar .xlsx</button></div>
    </div>`)}</div>
    <div class="card ro-hide">
      <div class="card-h"><div><h2>Backup e restauração</h2><p>Guarde uma cópia de todo o trabalho ou volte aos dados do documento original</p></div></div>
      <div class="actions">
        <button class="btn" disabled=${busy} onClick=${()=>salvar(`ScoutPro_backup_${hoje}.json`,JSON.stringify(st,null,2))}>${I.export}Baixar backup .json</button>
        <button class="btn" onClick=${()=>fileRef.current.click()}>Restaurar backup</button>
        <input type="file" id="imp" accept=".json,application/json" ref=${fileRef} hidden onChange=${importar}/>
        ${reset?html`<span class="confirm"><button class="btn primary" onClick=${()=>{up(padrao());setReset(false);toast("Dados do planejamento original restaurados")}}>Apagar edições e restaurar</button><button class="btn ghost" onClick=${()=>setReset(false)}>Cancelar</button></span>`
               :html`<button class="btn ghost" onClick=${()=>setReset(true)}>Restaurar dados do documento</button>`}
      </div>
    </div>
  </div>`;
}

/* ---------- App ---------- */
const TITULOS = {
  "painel":["Departamento de Análise","Painel do elenco","Situação do elenco 2026 frente ao perfil das 12 campanhas que subiram da Série C entre 2023 e 2025."],
  "elenco":["Temporada 2026","Elenco e contratos","32 atletas do planejamento: remanescentes, contratados, base e emprestados. Toda edição recalcula o app."],
  "comissao":["Corpo técnico","Comissão técnica","Profissionais do departamento de futebol, contratos, custos e a situação de cada um para 2027."],
  "benchmark":["Estudo Série C","Perfil de acesso 2023–2025","Rotação, idade, minutagem e desempenho de quem conquistou o acesso à Série B."],
  "planejamento-2027":["Próxima temporada","Planejamento 2027","Decida quem fica, monitore o mercado e veja a projeção do elenco contra o perfil de acesso."],
  "exportar":["Exportação","Planilhas e backup","Baixe o trabalho em Excel ou guarde um backup completo."],
};
const TEMAS=[{k:"auto",n:"Auto",c:"linear-gradient(90deg,#fff 50%,#16191c 50%)"},{k:"light",n:"Claro",c:"#fff"},{k:"dark",n:"Escuro",c:"#16191c"},{k:"black",n:"All black",c:"#000"}];
function useTema(){
  const [t,setT]=useState(()=>{ try{ return localStorage.getItem("scoutpro.tema")||"black"; }catch(e){ return "black"; } });
  useEffect(()=>{ document.body.classList.remove("t-light","t-dark","t-black"); if(t!=="auto") document.body.classList.add("t-"+t); try{ localStorage.setItem("scoutpro.tema",t); }catch(e){} },[t]);
  return [t,setT];
}
function App(){
  const store=useStore();
  const {state:st, sync, modo, user, entrar, sair, podeEditar}=store;
  const [login,setLogin]=useState(false);
  const [tema,setTema]=useTema();
  const ler=()=>{ const h=(location.hash||"").slice(1); return TITULOS[h]?h:"painel"; };
  const [tab,setTab]=useState(ler);
  const [msg,setMsg]=useState(null); const tm=useRef();
  const toast=useCallback(t=>{ setMsg(t); clearTimeout(tm.current); tm.current=setTimeout(()=>setMsg(null),3200); },[]);
  useEffect(()=>{ const f=()=>{ setTab(ler()); window.scrollTo(0,0); }; window.addEventListener("hashchange",f); return ()=>window.removeEventListener("hashchange",f); },[]);
  const roT=useRef(0);
  const up=useCallback(fn=>{ if(!podeEditar){ const now=Date.now(); if(now-roT.current>2500){ roT.current=now; toast(modo==="nuvem"?"Modo leitura: entre como editor para alterar":"Sem permissão para editar"); } return; } store.update(fn); },[podeEditar,modo,store.update,toast]);
  useEffect(()=>{ document.body.classList.toggle("ro", !podeEditar && modo!=="conectando"); },[podeEditar,modo]);
  const acesso = modo==="nuvem" ? (user
      ? html`<div class="lock"><span>Editor conectado</span><b>${user.email}</b><button class="btn sm ghost" onClick=${()=>{sair();toast("Você saiu. Modo leitura.")}}>Sair</button></div>`
      : html`<button class="btn sm" onClick=${()=>setLogin(true)}>Entrar como editor</button>`) : null;
  const [e,t,s]=TITULOS[tab];
  const brand=html`<div class="brand">${LOGO}<div><b>SCOUT<em>PRO</em></b><small>Análise & mercado</small></div></div>`;
  return html`<${EDIT.Provider} value=${podeEditar}><div class="shell">
    <aside class="rail">
      ${brand}
      <nav class="nav">${TABS.map(x=>html`<a key=${x.k} href=${"#"+x.k} class=${tab===x.k?"on":""}>${x.i}${x.n}${x.tag?html`<span class="tag">${x.tag}</span>`:null}</a>`)}</nav>
      <div class="rail-foot"><div class="client"><img src=${CREST} alt=""/><div><span>Clube</span><b>Santa Cruz F.C. · Recife</b></div></div><${SyncPill} s=${modo==="nuvem"&&sync==="online"?"nuvem":sync}/>
        ${acesso}
        <div class="themes" role="group" aria-label="Tema">${TEMAS.map(x=>html`<button key=${x.k} class=${tema===x.k?"on":""} aria-pressed=${tema===x.k} onClick=${()=>setTema(x.k)}><i style=${{background:x.c}}></i>${x.n}</button>`)}</div></div>
    </aside>
    <div style=${{minWidth:0}}>
      <div class="mhead">${brand}<div style=${{display:"flex",gap:"6px",alignItems:"center"}}>${modo==="nuvem"?html`<button class="btn sm" onClick=${()=>user?(sair(),toast("Você saiu. Modo leitura.")):setLogin(true)}>${user?"Sair":"Editar"}</button>`:null}<select class="mtheme" id="tema-m" aria-label="Tema" value=${tema} onChange=${e=>setTema(e.target.value)}>${TEMAS.map(x=>html`<option key=${x.k} value=${x.k}>${x.n}</option>`)}</select></div></div>
      <main class="main">
        <div class="top"><div><div class="eyebrow">${e}</div><h1>${t}</h1><p class="sub">${s}</p></div></div>
        ${tab==="painel"?html`<${Painel} st=${st}/>`:null}
        ${tab==="elenco"?html`<${Elenco} st=${st} up=${up} toast=${toast}/>`:null}
        ${tab==="comissao"?html`<${Comissao} st=${st} up=${up} toast=${toast}/>`:null}
        ${tab==="benchmark"?html`<${Benchmark} st=${st} up=${up} toast=${toast}/>`:null}
        ${tab==="planejamento-2027"?html`<${Plano} st=${st} up=${up} toast=${toast}/>`:null}
        ${tab==="exportar"?html`<${Exportar} st=${st} up=${up} toast=${toast}/>`:null}
      </main>
    </div>
    <nav class="mobile-tabs">${TABS.map(x=>html`<a key=${x.k} href=${"#"+x.k} class=${tab===x.k?"on":""}>${x.i}<span>${x.m||x.n}</span></a>`)}</nav>
    ${login?html`<${Login} entrar=${entrar} onClose=${ok=>{ setLogin(false); if(ok) toast("Modo editor ativo"); }}/>`:null}
    ${msg?html`<div class="toast" role="status">${msg}</div>`:null}
  </div><//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>

</body>
</html>
