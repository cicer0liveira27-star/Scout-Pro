<style>
/* Layout: sala de análise — trilho lateral fixo com o escudo, área de trabalho em painéis; no celular vira barra de abas inferior */
:root{
  --bg:#0e1012; --panel:#16191c; --panel2:#1d2125; --line:#2a3036; --line2:#353c43;
  --fg:#eceef0; --mute:#8b939b; --faint:#5d656d;
  --red:#e3262c; --red-ink:#ff4a4f; --red-soft:rgba(227,38,44,.14);
  --good:#2fb36b; --warn:#e3a62b; --bad:#ff5a5f; --info:#5b95ff;
  --st-rem:#5b95ff; --st-con:#2fb36b; --st-base:#e3a62b; --st-emp:#e3262c;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f3f4; --panel:#ffffff; --panel2:#f3f4f6; --line:#dfe2e6; --line2:#cfd4d9;
  --fg:#14171a; --mute:#59616a; --faint:#8c949c;
  --red:#cc151b; --red-ink:#c3121a; --red-soft:rgba(204,21,27,.09);
  --good:#1d8f52; --warn:#b77d0c; --bad:#d23338; --info:#2f6fe0;
  --st-rem:#2f6fe0; --st-con:#1d8f52; --st-base:#b77d0c; --st-emp:#cc151b;
  --shadow:0 1px 2px rgba(20,23,26,.06), 0 6px 18px rgba(20,23,26,.05);
  color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f2f3f4; --panel:#ffffff; --panel2:#f3f4f6; --line:#dfe2e6; --line2:#cfd4d9;
  --fg:#14171a; --mute:#59616a; --faint:#8c949c;
  --red:#cc151b; --red-ink:#c3121a; --red-soft:rgba(204,21,27,.09);
  --good:#1d8f52; --warn:#b77d0c; --bad:#d23338; --info:#2f6fe0;
  --st-rem:#2f6fe0; --st-con:#1d8f52; --st-base:#b77d0c; --st-emp:#cc151b;
  --shadow:0 1px 2px rgba(20,23,26,.06), 0 6px 18px rgba(20,23,26,.05);
  color-scheme:light;
}
/* Temas escolhidos no app (classe no body, independente do tema do sistema) */
body.t-dark{--bg:#0e1012;--panel:#16191c;--panel2:#1d2125;--line:#2a3036;--line2:#353c43;--fg:#eceef0;--mute:#8b939b;--faint:#5d656d;--red:#e3262c;--red-ink:#ff4a4f;--red-soft:rgba(227,38,44,.14);--good:#2fb36b;--warn:#e3a62b;--bad:#ff5a5f;--info:#5b95ff;--st-rem:#5b95ff;--st-con:#2fb36b;--st-base:#e3a62b;--st-emp:#e3262c;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
body.t-light{--bg:#f2f3f4;--panel:#fff;--panel2:#f3f4f6;--line:#dfe2e6;--line2:#cfd4d9;--fg:#14171a;--mute:#59616a;--faint:#8c949c;--red:#cc151b;--red-ink:#c3121a;--red-soft:rgba(204,21,27,.09);--good:#1d8f52;--warn:#b77d0c;--bad:#d23338;--info:#2f6fe0;--st-rem:#2f6fe0;--st-con:#1d8f52;--st-base:#b77d0c;--st-emp:#cc151b;--shadow:0 1px 2px rgba(20,23,26,.06),0 6px 18px rgba(20,23,26,.05);color-scheme:light}
body.t-black{--bg:#000;--panel:#000;--panel2:#0c0c0c;--line:#1c1c1c;--line2:#2a2a2a;--fg:#f4f4f4;--mute:#8c8c8c;--faint:#555;--red:#e3262c;--red-ink:#ff4d52;--red-soft:rgba(227,38,44,.15);--good:#3cc47a;--warn:#e8b13a;--bad:#ff5a5f;--info:#6ea2ff;--st-rem:#6ea2ff;--st-con:#3cc47a;--st-base:#e8b13a;--st-emp:#e3262c;--shadow:none;color-scheme:dark}
body.t-black .card,body.t-black .tablewrap,body.t-black .posbox{border-color:#1f1f1f}
body.t-black th{background:#080808}
.themes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:6px;overflow:hidden;width:100%}
.themes button{white-space:nowrap;border:0;background:transparent;padding:6px 4px;font-size:11px;cursor:pointer;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.themes button i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line2)}
.themes button.on{background:var(--panel2);color:var(--fg);font-weight:600}
body.ro .money,body.ro .ro-hide{display:none!important}
body.ro .cell{pointer-events:none}
body.ro select.cell{appearance:none;-webkit-appearance:none}
.lock{display:flex;flex-direction:column;gap:6px;font-size:12px}
.lock b{font-weight:600;color:var(--fg);word-break:break-all}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal form{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.err{color:var(--bad);font-size:12px}
.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 0%,var(--red-soft),transparent 60%),var(--bg)}
.gate-box{width:min(380px,100%);display:flex;flex-direction:column;gap:22px}
.gate-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-brand .logo{width:64px;height:64px}
.gate-brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.04em;line-height:1}
.gate-brand b em{font-style:normal;color:var(--red-ink)}
.gate-brand small{color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.gate form{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:20px}
.gate form label{font-size:12px;color:var(--mute);font-weight:500;margin-top:4px}
.gate form .field{padding:10px 12px;font-size:15px}
.gate form .btn.primary{margin-top:8px}
.gate-club{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-size:11.5px}
.gate-club img{width:20px}
.mtheme{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-ink);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:22px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .logo{width:40px;height:40px;flex:none}
.client{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.client img{width:26px;height:auto}
.client b{display:block;font-size:12px}
.client span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.crest{width:26px;height:26px;object-fit:contain;flex:none}
.club.up{cursor:pointer}
.club img{width:100%;height:100%;object-fit:contain}
.club.has{background:transparent;border-color:transparent}
.brand b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em;line-height:1}
.brand b em{font-style:normal;color:var(--red-ink)}
.brand small{display:block;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--mute);text-decoration:none;font-weight:500;position:relative}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--panel2);color:var(--fg)}
.nav a.on{background:var(--red-soft);color:var(--fg)}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--red);border-radius:0 2px 2px 0}
.nav .tag{margin-left:auto;font-size:10px;font-family:var(--f-mono);color:var(--red-ink);border:1px solid var(--red);border-radius:3px;padding:0 4px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:8px;padding:0 6px}

.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.online i,.sync.nuvem i{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent);animation:pulse 2s infinite}
.sync.salvando i{background:var(--warn)}
.sync.erro i{background:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-ink);font-weight:600}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.2vw,44px);line-height:1;letter-spacing:.01em;margin:4px 0 0;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.sub{color:var(--mute);margin:6px 0 0;max-width:68ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.5;cursor:default}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--mute);font-size:12px}
.span2{grid-column:1/-1}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1}
.kpi .v small{font-size:16px;color:var(--mute);font-weight:600;margin-left:3px}
.kpi .d{font-size:12px;color:var(--mute)}
.kpi .d b{font-weight:600}
.up{color:var(--bad)} .ok{color:var(--good)} .wn{color:var(--warn)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block;overflow:visible}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)} .alert.good{border-left-color:var(--good)}
.alert b{display:block;font-size:13px}
.alert span{color:var(--mute);font-size:12px}
.chip{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line2);white-space:nowrap}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 200px;min-width:0}
.field{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
.field:focus{border-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--fg);font-weight:600}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
td.r,th.r{text-align:right}
.cell{background:transparent;border:1px solid transparent;border-radius:4px;padding:5px 6px;width:100%;min-width:0}
.cell:hover{border-color:var(--line2)}
.cell:focus{border-color:var(--red);background:var(--panel2);outline:none}
.cell.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
select.cell{cursor:pointer}
.w-name{min-width:150px}
.stbar{width:4px;padding:0!important}
.stbar i{display:block;width:4px;height:28px;border-radius:2px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;background:var(--panel2);border:2px solid var(--line2);flex:none}

.pitch{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.posbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.posbox header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.posbox header b{font-family:var(--f-display);font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.posbox ul{list-style:none;margin:0;padding:6px}
.posbox li{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:6px}
.posbox li .nm{font-weight:600;font-size:13px;line-height:1.2}
.posbox li .meta{color:var(--mute);font-size:11px;font-family:var(--f-mono)}
.posbox li .end{margin-left:auto;text-align:right}
.dim{opacity:.5}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.club{display:inline-grid;place-items:center;width:34px;height:26px;overflow:hidden;border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.04em;background:var(--panel2);border:1px solid var(--line2);flex:none}

.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:10px}
.note{font-size:12px;color:var(--mute)}
.need{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel2)}
.need .big{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--red-ink);min-width:34px;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);border-radius:4px}
.bar.over i{background:var(--bad)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:4px}
.x{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:5px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--red-soft)}
.x svg{width:15px;height:15px}

.mobile-tabs{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .mobile-tabs{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mobile-tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;font-size:10.5px;color:var(--mute);text-decoration:none;font-weight:500}
  .mobile-tabs a svg{width:20px;height:20px}
  .mobile-tabs a.on{color:var(--red-ink)}
  .kpi .v{font-size:32px}
}
@media (min-width:861px){ .mhead{display:none} }
.mhead .brand .logo{width:32px;height:32px}
.mhead .brand b{font-size:20px}
.nav{overflow-y:auto;flex:1;min-height:0;margin-inline:-6px;padding-inline:6px}
.nav-g{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}

  .tablewrap:not(.planilha) td::before{content:attr(data-label);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
  .tablewrap:not(.planilha) td[data-label=""]::before{display:none}
  .tablewrap:not(.planilha) td.stbar{display:none}
  .tablewrap:not(.planilha) td:has(.w-name),.tablewrap:not(.planilha) td:has(textarea),.tablewrap:not(.planilha) td:first-child:not(.stbar){grid-column:1/-1}
  .tablewrap:not(.planilha) td:last-child:has(.x),.tablewrap:not(.planilha) td:last-child:has(.confirm){grid-column:1/-1;align-items:flex-end}
  .tablewrap:not(.planilha) td:last-child:has(.x)::before{display:none}
  .tablewrap:not(.planilha) .cell,.tablewrap:not(.planilha) select.cell,.tablewrap:not(.planilha) input.cell{width:100%!important;min-width:0!important;max-width:none!important;min-height:42px;font-size:16px!important;text-align:left}
  .tablewrap:not(.planilha) td>div{width:100%}
  .tablewrap:not(.planilha) .av{display:none}
  .tablewrap:not(.planilha) td .num{font-size:16px}
  .toolbar>.field,.toolbar>select{flex:1 1 140px}
/* Planilha (Gestão de Elenco): no celular continua tabela, com rolagem lateral e nome fixo */
.planilha td:nth-child(2),.planilha th:nth-child(2){position:sticky;left:4px;z-index:2;background:var(--panel)}
.planilha td.stbar,.planilha th.stbar{position:sticky;left:0;z-index:2;background:var(--panel)}
.planilha thead th{z-index:3}
@media (max-width:760px){
  .planilha{max-height:calc(100vh - 150px);overflow:auto;-webkit-overflow-scrolling:touch}
  .planilha table{font-size:13px}
  .planilha th{padding:8px 6px;font-size:10px}
  .planilha td{padding:2px 4px}
  .planilha .av{display:none}
  .planilha .w-name{min-width:118px!important;width:118px!important}
  .planilha .cell{padding:6px 5px;font-size:15px!important}
  .planilha td:nth-child(2){box-shadow:6px 0 8px -6px rgba(0,0,0,.5)}
  .planilha select.cell{min-width:68px!important;width:auto!important}
}
}
.clubes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.clube{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.clube b{font-size:13px;line-height:1.2}
.clube.nosso{border-color:var(--red);background:var(--red-soft)}
.club img{border-radius:3px}
@media (max-width:860px){input,select,textarea,.field,.cell,.gate form .field{font-size:16px!important}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.tablewrap td input.cell,.tablewrap td select.cell{border-color:var(--line);background:color-mix(in srgb,var(--panel2) 70%,transparent)}
.tablewrap td input.cell:focus,.tablewrap td select.cell:focus{border-color:var(--red)}
</style>

const n = v => { if(v===""||v===null||v===undefined) return null; const x = typeof v==="number"?v:parseFloat(String(v).replace(",",".")); return isFinite(x)?x:null; };
const avg = a => { const b=a.filter(x=>x!==null&&x!==undefined&&isFinite(x)); return b.length? b.reduce((s,x)=>s+x,0)/b.length : null; };
const sum = a => a.reduce((s,x)=>s+(n(x)||0),0);
const f1 = v => v===null||v===undefined ? "—" : v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const f2 = v => v===null||v===undefined ? "—" : v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const nascOk = (v,ano=new Date().getFullYear()) => { const y=n(v); return y!=null && Number.isInteger(y) && y>=1940 && y<=ano; };
const idade = (j,ano) => nascOk(j.nasc) ? ano - n(j.nasc) : null;
const nascInvalidos = lista => lista.filter(j=>String(j.nasc??"").trim()!=="" && !nascOk(j.nasc));

function pearson(xs,ys){ const m=xs.length; if(m<3) return null; const mx=avg(xs),my=avg(ys); let a=0,b=0,c=0; for(let i=0;i<m;i++){const dx=xs[i]-mx,dy=ys[i]-my;a+=dx*dy;b+=dx*dx;c+=dy*dy;} return b&&c? a/Math.sqrt(b*c):null; }
function regress(xs,ys){ const mx=avg(xs),my=avg(ys); let a=0,b=0; xs.forEach((x,i)=>{a+=(x-mx)*(ys[i]-my);b+=(x-mx)**2}); const s=b?a/b:0; return {s, i:my-s*mx}; }

function porPos(lista, ano){
  const o={}; POS.forEach(p=>o[p.k]={qtd:0,idades:[]});
  lista.forEach(j=>{ if(!o[j.pos]) return; o[j.pos].qtd++; const i=idade(j,ano); if(i!==null) o[j.pos].idades.push(i); });

function gravarLocal(s){ try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){} }
function migrar(s){
  const d=padrao(); if(!s||typeof s!=="object") return d;
  const o={...d, ...s};
  Object.keys(d).forEach(k=>{ if(Array.isArray(d[k]) && !Array.isArray(o[k])) o[k]=d[k]; if(d[k] && typeof d[k]==="object" && !Array.isArray(d[k]) && (!o[k]||typeof o[k]!=="object")) o[k]=d[k]; });
  const jaSemeado = s.config && s.config.advSeed;
  o.config={...d.config, ...(o.config||{}), advSeed:true};
  if(!jaSemeado && !(s.adversarios||[]).length) o.adversarios=adversariosPadrao();
  if(!(s.config&&s.config.jogosSeed)){ const tem=new Set((o.jogos||[]).map(j=>j.data+"|"+normNome(j.adversario))); o.jogos=[...(o.jogos||[]), ...jogosPadrao().filter(j=>!tem.has(j.data+"|"+normNome(j.adversario)))]; }
  o.config.jogosSeed=true;
  if(!(s.config&&s.config.statsSeed)) o.jogos=(o.jogos||[]).map(comFS);
  o.config.statsSeed=true;
  if(!(s.config&&s.config.wsSeed)){ o.jogos=(o.jogos||[]).map(comWS); if(!(s.treinos||[]).length) o.treinos=treinosPadrao(); }
  o.config.wsSeed=true;
  if(PACOTE()&&(!o.config.wsPacote||(o.config.wsPacoteVersao||1)<(PACOTE().versao||1))){ try{ Object.assign(o,aplicarPacote(o,PACOTE()).s); }catch(e){} }
  o.elenco=o.elenco.map(j=>({vinculo:j.status==="Emprestado"?"Emprestado":"Ativo", saude:"Liberado", dor:false, ...j}));
  return o;
}

const FBV = "https://www.gstatic.com/firebasejs/10.12.2/";
// Acesso: login por nickname ou CPF + senha. Nenhuma senha fica no código: só o hash PBKDF2 da senha inicial,
// usado para criar a conta no primeiro acesso. O CPF também só aparece como hash apontando para o nickname.
const DOMINIO = "@scoutpro.app";
const USUARIOS = {ciceroav:"Cícero", phsouzaleao:"Paulinho"};
const CPF_HASH = {"f0c51d87a4c2309df9822c9f87b028517bbdcbffcd08c589b92dcff1c006ee7c":"ciceroav","d6a72fc6ecd7b7a4b4ce70fcff567cec6edaacc97c1ad9116f58e863691fa2ae":"phsouzaleao"};
const SENHA_INICIAL_H = "ccdd86ace2993e7cd7bb5ca7639986f24b6eb8be397d3318cd21f2ea2ef9b9f5";
async function sha256(t){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function pbkdf2(t){ const enc=new TextEncoder(); const key=await crypto.subtle.importKey("raw",enc.encode(t),"PBKDF2",false,["deriveBits"]); const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode("scoutpro-v1"),iterations:150000},key,256); return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
async function resolverLogin(ident){
  const t=String(ident||"").trim().toLowerCase(); const d=t.replace(/\D/g,"");
  if(d.length===11 && /^[\d.\-\s]+$/.test(t)) return CPF_HASH[await sha256("scoutpro|"+d)] || null;
  return USUARIOS[t] ? t : null;
}
const comTempo = (p,ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo")),ms))]);
const CHAVES = () => Object.keys(padrao());

function useStore(){
  const [state,setState] = useState(()=>migrar(lerLocal()));
  const stRef = useRef(state); stRef.current = state;
  const [sync,setSync] = useState("conectando");
  const [modo,setModo] = useState("conectando"); // nuvem | claude | local | offline
  const [user,setUser] = useState(null);
  const fb = useRef(null), writer = useRef(null), pend = useRef(null), writing = useRef(false), timer = useRef(null);
  const cid = useRef(Math.random().toString(36).slice(2));
  const flush = useRef(null);
  flush.current = async () => {
    if(writing.current || !pend.current || !writer.current) return;
    const s = pend.current; pend.current = null; writing.current = true; setSync("salvando");
    try{ await writer.current(s); setSync("online"); }
    catch(e){ setSync(/grant|writer|denied|permission/i.test((e&&(e.code||e.message))||"") ? "leitura" : "erro"); }
    writing.current = false;
    if(pend.current) flush.current();
  };
  useEffect(()=>{
    let alive = true, unsub = null;
    const meta = () => ({by:cid.current, at:new Date().toISOString()});
    (async()=>{
      const cfg = window.SCOUTPRO_FIREBASE;
      if(cfg && cfg.apiKey && cfg.projectId){
        try{
          const [appM,authM,fsM] = await comTempo(Promise.all([import(FBV+"firebase-app.js"),import(FBV+"firebase-auth.js"),import(FBV+"firebase-firestore.js")]), 12000);
          if(!alive) return;
          const app = appM.initializeApp(cfg), db = fsM.getFirestore(app);
          // Sessão guardada no aparelho (IndexedDB, com localStorage de reserva): só sai pelo botão Sair.
          let auth;
          try{ auth = authM.initializeAuth(app, {persistence:[authM.indexedDBLocalPersistence, authM.browserLocalPersistence]}); }
          catch(e){ auth = authM.getAuth(app); try{ await authM.setPersistence(auth, authM.browserLocalPersistence); }catch(e2){} }
          fb.current = {authM, auth};
          const col = fsM.collection(db, "scoutpro_dados");
          const ultimo = {}; let subs = [];
          writer.current = async st => {
            const m = meta();
            for(const k of CHAVES()){
              const j = JSON.stringify(st[k] ?? null);
              if(ultimo[k] === j) continue;
              await fsM.setDoc(fsM.doc(db, "scoutpro_dados", k), {json:j, ...m});
              ultimo[k] = j;
            }
          };
          authM.onAuthStateChanged(auth, u => {
            subs.forEach(f=>f()); subs = [];
            setUser(u ? {email:u.email, nick:(u.email||"").split("@")[0]} : null);
            if(!u) return;
            setSync("conectando");
            subs.push(fsM.onSnapshot(col, snap => {
              if(pend.current || writing.current) return;
              let mudou = false; const base = stRef.current;
              const novo = {...base};
              snap.docs.forEach(d => { const v=d.data(); if(!v) return; ultimo[d.id]=v.json; if(v.by===cid.current) return; try{ novo[d.id]=JSON.parse(v.json); mudou=true; }catch(e){} });
              if(mudou){ const s=migrar(novo); setState(s); gravarLocal(s); }
              setSync("online");
            }, e => setSync(/permission/i.test((e&&e.code)||"") ? "leitura" : "erro")));
          });
          try{ await comTempo(auth.authStateReady(), 8000); }catch(e){}
          if(!alive) return;
          setModo("nuvem");
          unsub = () => subs.forEach(f=>f());
          return;
        }catch(e){ console.warn("Firebase indisponível", e); if(alive){ setModo("offline"); setSync("erro"); } return; }
      }
      let d = null;
      try{ d = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ d = null; }
      if(!alive) return;
      if(!d){ setModo("local"); setSync("local"); return; }
      const ref = d.doc("scout/estado");
      writer.current = st => ref.set({json:JSON.stringify(st), ...meta()});
      setModo("claude");
      unsub = ref.onSnapshot(snap => {
        const data = snap.exists ? snap.data() : null;
        if(!data || data.by===cid.current){ setSync("online"); return; }
        if(pend.current || writing.current) return;
        try{ const s = migrar(JSON.parse(data.json)); setState(s); gravarLocal(s); }catch(e){}
        setSync("online");
      }, () => setSync("erro"));
    })();
    return ()=>{ alive=false; if(unsub) unsub(); };
  },[]);
  const update = useCallback(fn=>{
    setState(prev=>{
      const next = typeof fn==="function" ? fn(prev) : fn;
      gravarLocal(next);
      if(writer.current){ pend.current = next; clearTimeout(timer.current); timer.current = setTimeout(()=>flush.current(), 600); }
      return next;
    });
  },[]);
  const entrar = async (ident, senha) => {
    const f=fb.current; if(!f) throw {code:"sem-nuvem"};
    const nick = await resolverLogin(ident); if(!nick) throw {code:"usuario-desconhecido"};
    const email = nick+DOMINIO;
    try{ await f.authM.signInWithEmailAndPassword(f.auth, email, senha); }
    catch(e){
      const c=(e&&e.code)||"";
      // Primeiro acesso: a conta ainda não existe e a senha é a inicial combinada → cria a conta.
      if(/invalid-credential|user-not-found|invalid-login/.test(c) && await pbkdf2(senha)===SENHA_INICIAL_H){
        try{ await f.authM.createUserWithEmailAndPassword(f.auth, email, senha); return; }
        catch(e2){ if(/email-already-in-use/.test((e2&&e2.code)||"")) throw {code:"auth/wrong-password"}; throw e2; }
      }
      throw e;
    }
  };
  const sair = async () => { const f=fb.current; if(f) await f.authM.signOut(f.auth); try{ localStorage.removeItem(LS_KEY); }catch(e){} setState(padrao()); };
  const podeEditar = modo==="nuvem" ? (!!user && sync!=="leitura") : (modo!=="conectando" && sync!=="leitura");
  return {state, update, sync, modo, user, entrar, sair, podeEditar};
}

        <button type="button" class="btn sm ghost" style=${{position:"absolute",right:"4px",top:"50%",transform:"translateY(-50%)",border:0}} onClick=${()=>setVer(!ver)}>${ver?"Ocultar":"Mostrar"}</button></div>

      <button class="btn primary" type="submit" disabled=${busy||modo!=="nuvem"} style=${{justifyContent:"center",padding:"11px"}}>${modo!=="nuvem"?"Conectando…":busy?"Entrando…":"Entrar"}</button>

  </div></div>`;

function Delta({a,b,inv,suf=""}){

  const d=a-b, ok = inv ? d<=0 : d>=0;
  const cls = Math.abs(d)<0.05 ? "" : ok ? "ok" : "up";
  return html`<b class=${cls}>${d>0?"+":""}${f1(d)}${suf}</b>`;
}

/* Dumbbell: idade por posição, Santa Cruz vs média dos acessos */
function IdadeChart({pp}){
  const W=560, rowH=34, top=26, left=110, right=24, H=top+POS.length*rowH+30;
  const lo=18, hi=40, x=v=>left+(v-lo)/(hi-lo)*(W-left-right);
  const ticks=[18,22,26,30,34,38];
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Idade média por posição">
    ${ticks.map(t=>html`<g key=${t}><line x1=${x(t)} x2=${x(t)} y1=${top-8} y2=${H-24} stroke="var(--line)" stroke-dasharray="2 4"/><text x=${x(t)} y=${H-8} text-anchor="middle" font-size="11" fill="var(--mute)">${t}</text></g>`)}
    ${POS.map((p,i)=>{ const y=top+i*rowH+rowH/2; const sc=pp[p.k].idade, b=BENCH_IDADE[p.k];
      const diff = sc===null?0:sc-b; const col = Math.abs(diff)>=3 ? "var(--bad)" : Math.abs(diff)>=1.5 ? "var(--warn)" : "var(--good)";
      return html`<g key=${p.k}>
        <text x=${left-12} y=${y+4} text-anchor="end" font-size="12" fill="var(--fg)" font-weight="500">${p.s}</text>
        ${sc!==null?html`<line x1=${x(b)} x2=${x(sc)} y1=${y} y2=${y} stroke=${col} stroke-width="3" stroke-linecap="round" opacity=".55"/>`:null}
        <circle cx=${x(b)} cy=${y} r="6" fill="var(--panel)" stroke="var(--mute)" stroke-width="2"/>
        ${sc!==null?html`<circle cx=${x(sc)} cy=${y} r="7" fill="var(--red)"/>
        <text x=${x(sc)+(sc>=b?12:-12)} y=${y+4} text-anchor=${sc>=b?"start":"end"} font-size="11" fill=${col} font-family="IBM Plex Mono,monospace">${f1(sc)}</text>`:null}
      </g>`; })}
    <text x=${left} y="12" font-size="11" fill="var(--mute)">anos</text>
  </svg>`;
}

/* Barras de profundidade por posição com marcador da média dos acessos */
function ProfChart({pp}){
  const W=560, rowH=32, top=10, left=110, right=40, H=top+POS.length*rowH+24;
  const max=Math.max(9,...POS.map(p=>pp[p.k].qtd)); const x=v=>left+v/max*(W-left-right);
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Atletas por posição">
    ${[0,2,4,6,8].filter(t=>t<=max).map(t=>html`<g key=${t}><line x1=${x(t)} x2=${x(t)} y1=${top} y2=${H-20} stroke="var(--line)"/><text x=${x(t)} y=${H-6} text-anchor="middle" font-size="11" fill="var(--mute)">${t}</text></g>`)}
    ${POS.map((p,i)=>{ const y=top+i*rowH; const q=pp[p.k].qtd, b=BENCH_QTD[p.k]; const short=q<Math.round(b)-0.01;
      return html`<g key=${p.k}>
        <text x=${left-12} y=${y+rowH/2+4} text-anchor="end" font-size="12" fill="var(--fg)" font-weight="500">${p.s}</text>
        <rect x=${left} y=${y+7} width=${Math.max(0,x(q)-left)} height=${rowH-14} rx="3" fill=${short?"var(--bad)":"var(--red)"} opacity=${short?1:.9}/>
        <text x=${x(q)+6} y=${y+rowH/2+4} font-size="11" fill="var(--fg)" font-family="IBM Plex Mono,monospace">${q}</text>
        <line x1=${x(b)} x2=${x(b)} y1=${y+3} y2=${y+rowH-3} stroke="var(--fg)" stroke-width="2"/>
      </g>`; })}

}

function Composicao({lista}){
  const tot=lista.length||1;
  const parts=Object.keys(STATUS).map(k=>({k,q:lista.filter(j=>j.status===k).length}));
  return html`<div>
    <div style=${{display:"flex",height:"14px",borderRadius:"4px",overflow:"hidden",gap:"2px",marginBottom:"12px"}}>

}

function Faixas({lista,ano}){
  const fx=[["≤ 20",0,20],["21–24",21,24],["25–28",25,28],["29–32",29,32],["33+",33,99]];
  const c=fx.map(f=>lista.filter(j=>{const i=idade(j,ano);return i!==null&&i>=f[1]&&i<=f[2]}).length);
  const max=Math.max(1,...c); const W=320,H=150,bw=44,gap=(W-fx.length*bw)/(fx.length+1);
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Faixas etárias">
    <line x1="0" x2=${W} y1=${H-22} y2=${H-22} stroke="var(--line2)"/>
    ${fx.map((f,i)=>{ const h=c[i]/max*(H-50); const xx=gap+i*(bw+gap);
      return html`<g key=${i}><rect x=${xx} y=${H-22-h} width=${bw} height=${h} rx="3" fill=${i>=3?"var(--mute)":"var(--red)"} opacity=${i>=3?.6:.9}/>
      <text x=${xx+bw/2} y=${H-26-h} text-anchor="middle" font-size="12" fill="var(--fg)" font-family="IBM Plex Mono,monospace">${c[i]}</text>
      <text x=${xx+bw/2} y=${H-6} text-anchor="middle" font-size="11" fill="var(--mute)">${f[0]}</text></g>`; })}
  </svg>`;
}

/* ---------- Painel ---------- */
function Painel({st}){
  const ano=st.temporada;
  const aprov = st.elenco.filter(j=>j.aproveitado);
  const pp = useMemo(()=>porPos(aprov,ano),[st.elenco,ano]);
  const idadeMed = avg(aprov.map(j=>idade(j,ano)));
  const altMed = avg(aprov.map(j=>n(j.alt)));
  const benchIdade = avg(st.bench.map(t=>n(t.idade)));
  const benchUsados = avg(st.bench.map(t=>n(t.usados)));
  const folhaAtl = sum(st.elenco.map(j=>j.salario));
  const folhaCom = sum(st.comissao.map(c=>c.salario));
  const folha = folhaAtl + folhaCom;
  const orc = n(st.orc2026);
  const titulares = st.elenco.filter(j=>n(j.minutos)!==null&&n(j.minutos)>50).length;
  const rotacao = st.elenco.filter(j=>n(j.minutos)!==null&&n(j.minutos)>=25&&n(j.minutos)<=50).length;
  const temMin = st.elenco.some(j=>n(j.minutos)!==null);
  const gols = sum(st.elenco.map(j=>j.gols));

  const alertas = [];
  POS.forEach(p=>{
    const q=pp[p.k].qtd, b=BENCH_QTD[p.k], i=pp[p.k].idade, bi=BENCH_IDADE[p.k];
    if(q < Math.round(b)) alertas.push({t:"bad", h:`${p.n}: ${q} de ${f1(b)} na média`, s:`Faltam ${Math.round(b)-q} atleta(s) para a profundidade dos times que subiram.`});
    if(i!==null && i-bi>=3) alertas.push({t:"warn", h:`${p.n}: idade ${f1(i)} vs ${f1(bi)}`, s:`${f1(i-bi)} anos acima do perfil dos acessos.`});
  });
  if(idadeMed!==null && benchIdade!==null && idadeMed-benchIdade>1) alertas.push({t:"warn", h:`Idade geral ${f1(idadeMed)} vs ${f1(benchIdade)}`, s:"O elenco aproveitado está mais velho que a média dos acessos 2023–2025."});
  if(!alertas.length) alertas.push({t:"good", h:"Elenco dentro do perfil de acesso", s:"Nenhuma posição abaixo da profundidade ou com idade fora da faixa."});

  return html`<div class="grid" style=${{gap:"16px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Atletas aproveitados" v=${aprov.length} d=${html`de ${st.elenco.length} no elenco · média acesso <b>${f1(benchUsados)}</b> utilizados`}/>
      <${Kpi} l="Idade média" v=${f1(idadeMed)} u="anos" d=${html`<${Delta} a=${idadeMed} b=${benchIdade} inv=${true}/> vs ${f1(benchIdade)} dos acessos`}/>
      <${Kpi} l="Altura média" v=${f2(altMed)} u="m" d="atletas aproveitados"/>
      <${Kpi} cls="money" l="Folha mensal" v=${folha?brl(folha):"—"} d=${folha? html`atletas ${brl(folhaAtl)} · comissão ${brl(folhaCom)}` : "preencha salários no Elenco e na Comissão"}/>
      <${Kpi} l="Núcleo (+50% min.)" v=${temMin?titulares:"—"} d=${html`acessos: <b>${f1(BENCH_NUCLEO.tit)}</b> titulares + ${f1(BENCH_NUCLEO.rot)} em rotação${temMin?` · SC ${rotacao} em rotação`:""}`}/>
      <${Kpi} l="Comissão técnica" v=${st.comissao.length||"—"} d=${st.comissao.length?(st.comissao.find(c=>c.funcao==="Técnico")?.nome ? "Técnico: "+st.comissao.find(c=>c.funcao==="Técnico").nome : "técnico não cadastrado") : html`<a href="#comissao" style=${{color:"var(--red-ink)"}}>Cadastrar profissionais</a>`}/>
      <${Kpi} l="Gols do elenco" v=${gols||"—"} d="soma dos gols lançados"/>
    </div>

    <div class="grid g-2">
      <div class="card">
        <div class="card-h"><div><h2>Idade por posição</h2><p>Santa Cruz (aproveitados, ${ano}) contra a média de quem subiu</p></div>
          <div class="legend"><span><i style=${{background:"var(--red)",borderRadius:"50%"}}></i>Santa Cruz</span><span><i style=${{border:"2px solid var(--mute)",borderRadius:"50%"}}></i>Média acessos</span></div></div>
        <${IdadeChart} pp=${pp}/>
      </div>
      <div class="card">
        <div class="card-h"><div><h2>Profundidade</h2><p>Atletas por posição; o traço marca a média utilizada pelos acessos</p></div>
          <div class="legend"><span><i style=${{background:"var(--red)"}}></i>Dentro</span><span><i style=${{background:"var(--bad)"}}></i>Abaixo</span></div></div>
        <${ProfChart} pp=${pp}/>
      </div>
    </div>

    <div class="grid g-3">
      <div class="card"><div class="card-h"><div><h2>Composição</h2><p>Origem dos ${st.elenco.length} atletas</p></div></div><${Composicao} lista=${st.elenco}/></div>
      <div class="card"><div class="card-h"><div><h2>Faixa etária</h2><p>Atletas aproveitados em ${ano}</p></div></div><${Faixas} lista=${aprov} ano=${ano}/></div>
      <div class="card"><div class="card-h"><div><h2>Alertas</h2><p>Recalculados a cada alteração</p></div><span class="chip">${alertas.filter(a=>a.t!=="good").length}</span></div>
        <div class="alerts">${alertas.slice(0,6).map((a,i)=>html`<div key=${i} class=${"alert "+(a.t==="bad"?"bad":a.t==="good"?"good":"")}><div><b>${a.h}</b><span>${a.s}</span></div></div>`)}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div><h2>Diretrizes do estudo</h2><p>O que levou ao acesso na Série C 2023–2025</p></div></div>
      <div class="grid g-3" style=${{gap:"12px"}}>
        <div class="need"><span class="big">0,85</span><div><b>Ataque é o motor do acesso</b><div class="note">Correlação gols marcados × pontos. 11 das 12 campanhas estavam entre os melhores ataques.</div></div></div>
        <div class="need"><span class="big">~17</span><div><b>Núcleo enxuto decide</b><div class="note">8,9 titulares absolutos + 7,9 em rotação concentram a campanha.</div></div></div>
        <div class="need"><span class="big">0,24</span><div><b>Defesa pesa menos</b><div class="note">Correlação gols sofridos × pontos. Metade subiu com defesa abaixo da média.</div></div></div>
      </div>
    </div>
  </div>`;
}

/* ---------- Elenco ---------- */
function Del({onYes}){
  const ed=React.useContext(EDIT);
  const [c,setC]=useState(false);
  useEffect(()=>{ if(!c) return; const t=setTimeout(()=>setC(false),3500); return ()=>clearTimeout(t); },[c]);
  if(!ed) return null;
  return c ? html`<span class="confirm"><button class="btn sm primary" onClick=${onYes}>Remover</button><button class="btn sm ghost" onClick=${()=>setC(false)}>Não</button></span>`
           : html`<button class="x" title="Remover" aria-label="Remover" onClick=${()=>setC(true)}>${I.trash}</button>`;
}

function Elenco({st,up,toast}){
  const [q,setQ]=useState(""); const [fp,setFp]=useState(""); const [fs,setFs]=useState(""); const [vis,setVis]=useState("tabela");
  const ano=st.temporada;
  const set=(id,k,v)=>up(s=>({...s, elenco:s.elenco.map(j=>j.id===id?{...j,[k]:v}:j)}));
  const add=()=>{ const j=P("Novo atleta",fp||"MEI",ano-24,"",  "Contratado"); up(s=>({...s, elenco:[...s.elenco,j], decisoes:{...s.decisoes,[j.id]:"Manter"}})); toast("Atleta adicionado ao fim da lista"); };
  const del=id=>up(s=>{ const d={...s.decisoes}; delete d[id]; return {...s, elenco:s.elenco.filter(j=>j.id!==id), decisoes:d}; });
  const ord = POS.map(p=>p.k);
  const lista = st.elenco.filter(j=>(!fp||j.pos===fp)&&(!fs||j.status===fs)&&(!q||j.nome.toLowerCase().includes(q.toLowerCase())))
    .slice().sort((a,b)=>ord.indexOf(a.pos)-ord.indexOf(b.pos));
  const numIn=(j,k,step,w,ph)=>html`<input class="cell n" id=${k+"-"+j.id} inputmode="decimal" style=${{width:w||"64px"}} value=${j[k]} placeholder=${ph==null?"":String(ph)} title=${ph!=null&&(j[k]===""||j[k]==null)?"Automático (Sofascore/Flashscore). Digite para substituir.":""} onInput=${e=>set(j.id,k,e.target.value)}/>`;
  const auto=j=>{ const a=acharAtleta(j.nome); const x=a&&a.st?statsAtl(a,""):null; const l=lancesDe(st,j.nome); return {jogos:x?x.appearances:null,gols:Math.max(l.g,x?x.goals||0:0)||null,assist:Math.max(l.a,x?x.assists||0:0)||null}; };

  return html`<div>
    <div class="toolbar">
      <input class="field grow" id="busca-elenco" placeholder="Buscar atleta" value=${q} onInput=${e=>setQ(e.target.value)}/>
      <select class="field" id="f-pos" style=${{width:"auto"}} value=${fp} onChange=${e=>setFp(e.target.value)}><option value="">Todas as posições</option>${POS.map(p=>html`<option key=${p.k} value=${p.k}>${p.s}</option>`)}</select>
      <select class="field" id="f-st" style=${{width:"auto"}} value=${fs} onChange=${e=>setFs(e.target.value)}><option value="">Todos os vínculos</option>${Object.keys(STATUS).map(k=>html`<option key=${k}>${k}</option>`)}</select>
      <div class="seg" role="tablist"><button class=${vis==="tabela"?"on":""} onClick=${()=>setVis("tabela")}>Tabela</button><button class=${vis==="posicao"?"on":""} onClick=${()=>setVis("posicao")}>Por posição</button></div>
      <button class="btn primary ro-hide" onClick=${add}>${I.plus}Atleta</button>
    </div>

    ${vis==="tabela" ? html`<div class="tablewrap planilha"><table>
      <thead><tr><th class="stbar"></th><th>Atleta</th><th>Posição</th><th class="r">Nasc.</th><th class="r">Idade</th><th class="r">Altura</th><th>Vínculo</th><th>Aprov.</th><th class="r money">Salário (R$)</th><th class="r">Contrato até</th><th class="r">% Min</th><th class="r">J</th><th class="r">G</th><th class="r">A</th><th class="r">Nota</th><th></th></tr></thead>
      <tbody>${lista.map(j=>html`<tr key=${j.id} class=${j.aproveitado?"":"dim-row"}>
        <td class="stbar"><i style=${{background:STATUS[j.status]?.c||"var(--line2)"}}></i></td>
        <td><div style=${{display:"flex",alignItems:"center",gap:"8px"}}><${AvJ} nome=${j.nome} cor=${STATUS[j.status]?.c}/><input class="cell w-name" id=${"nome-"+j.id} value=${j.nome} onInput=${e=>set(j.id,"nome",e.target.value)}/></div></td>
        <td><select class="cell" id=${"pos-"+j.id} value=${j.pos} onChange=${e=>set(j.id,"pos",e.target.value)}>${POS.map(p=>html`<option key=${p.k} value=${p.k}>${p.k}</option>`)}</select></td>
        <td class="r"><input class="cell n" id=${"nasc-"+j.id} inputmode="numeric" maxlength="4" style=${{width:"60px",...(String(j.nasc??"").trim()!==""&&!nascOk(j.nasc)?{borderColor:"var(--bad)",color:"var(--bad)"}:{})}} value=${j.nasc} onInput=${e=>set(j.id,"nasc",e.target.value.replace(/\D/g,"").slice(0,4))}/></td>
        <td class="r num">${idade(j,ano)??"—"}</td>
        <td class="r">${numIn(j,"alt",.01,"58px")}</td>
        <td><select class="cell" id=${"st-"+j.id} value=${j.status} onChange=${e=>set(j.id,"status",e.target.value)} style=${{color:STATUS[j.status]?.c,fontWeight:600}}>${Object.keys(STATUS).map(k=>html`<option key=${k}>${k}</option>`)}</select></td>

        <td class="r">${numIn(j,"jogos",1,"42px",auto(j).jogos)}</td>
        <td class="r">${numIn(j,"gols",1,"42px",auto(j).gols)}</td>
        <td class="r">${numIn(j,"assist",1,"42px",auto(j).assist)}</td>
        <td class="r">${numIn(j,"nota",.1,"46px")}</td>
        <td><${Del} onYes=${()=>del(j.id)}/></td>
      </tr>`)}</tbody></table></div>
      ${!lista.length?html`<div class="empty" style=${{marginTop:"12px"}}>Nenhum atleta com esses filtros.</div>`:null}
      <p class="note">Edite direto na célula: painel, alertas, planejamento 2027 e planilhas recalculam na hora. Desmarque “Aprov.” para tirar o atleta das médias. % Min acima de 50 conta como titular absoluto; entre 25 e 50, rotação.</p>`
    : html`<div class="pitch">${POS.filter(p=>!fp||p.k===fp).map(p=>{ const js=lista.filter(j=>j.pos===p.k); const ia=avg(js.filter(j=>j.aproveitado).map(j=>idade(j,ano)));
        return html`<section class="posbox" key=${p.k}><header><b>${p.n}</b><span class="note num">${js.length} · ${f1(ia)} anos · média acesso ${f1(BENCH_QTD[p.k])}</span></header>
          <ul>${js.map(j=>html`<li key=${j.id} class=${j.aproveitado?"":"dim"}><${AvJ} nome=${j.nome} cor=${STATUS[j.status]?.c}/>
            <div><div class="nm">${j.nome}</div><div class="meta">${n(j.nasc)?String(j.nasc).slice(-2):"—"} · ${idade(j,ano)??"—"} anos · ${n(j.alt)?f2(n(j.alt))+"m":"—"}</div></div>

          ${!js.length?html`<li class="note">Sem atletas</li>`:null}</ul></section>`; })}</div>`}
  </div>`;
}


/* ---------- Comissão técnica ---------- */
const ESSENCIAIS = ["Técnico","Auxiliar técnico","Preparador físico","Preparador de goleiros","Analista de desempenho","Médico","Fisioterapeuta","Fisiologista"];
const SIT_COM = ["Manter","Renovar","Avaliar","Liberar"];
function Comissao({st,up,toast}){
  const [fun,setFun]=useState("Técnico");
  const ano=st.temporada;
  const set=(id,k,v)=>up(s=>({...s, comissao:s.comissao.map(c=>c.id===id?{...c,[k]:v}:c)}));
  const add=()=>{ up(s=>({...s, comissao:[...s.comissao,{id:uid("c"),nome:"",funcao:fun,nasc:"",desde:String(ano),contrato:"",salario:"",sit2027:"Manter",obs:""}]})); toast(fun+" adicionado"); };
  const del=id=>up(s=>({...s, comissao:s.comissao.filter(c=>c.id!==id)}));
  const ord=FUNCOES;
  const lista=st.comissao.slice().sort((a,b)=>ord.indexOf(a.funcao)-ord.indexOf(b.funcao));
  const folha=sum(st.comissao.map(c=>c.salario));
  const vencem=st.comissao.filter(c=>n(c.contrato)!==null&&n(c.contrato)<=ano);
  const tem=new Set(st.comissao.map(c=>c.funcao));
  const faltam=ESSENCIAIS.filter(f=>!tem.has(f));
  const areas=["Campo e análise","Saúde e performance","Gestão","Apoio"].map(a=>({a, q:st.comissao.filter(c=>AREA(c.funcao)===a).length}));
  return html`<div class="grid" style=${{gap:"16px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Profissionais" v=${st.comissao.length} d=${areas.filter(x=>x.q).map(x=>x.q+" "+x.a.toLowerCase()).join(" · ")||"nenhum cadastrado"}/>

/* ---------- Escudos ---------- */
function ClubMark({t,onSet}){
  const ref=useRef();
  const pick=async e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return; try{ onSet(await lerEscudo(f)); }catch(err){ onSet(null,"Não foi possível ler essa imagem. Use PNG, JPG ou SVG."); } };
  const esc = escudoDe(t);
  const body = esc ? html`<img src=${esc} alt=${"Escudo "+t.nome} referrerpolicy="no-referrer"/>` : t.sigla;
  if(!onSet) return html`<span class=${"club"+(esc?" has":"")}>${body}</span>`;
  return html`<span style=${{display:"inline-flex",alignItems:"center",gap:"2px"}}>
    <button class=${"club up"+(esc?" has":"")} title=${t.escudo?"Trocar escudo":"Enviar escudo"} aria-label=${"Escudo de "+t.nome} onClick=${()=>ref.current.click()}>${body}</button>
    <input type="file" id=${"esc-"+t.id} accept="image/*" hidden ref=${ref} onChange=${pick}/>
  </span>`;
}

const normNome = t => String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\.(png|jpe?g|webp|svg|gif)$/,"").replace(/\b(fc|ec|sc|ac|futebol clube|esporte clube)\b/g,"").replace(/[^a-z0-9]+/g," ").trim();

function EscImg({src,alt,size=22}){
  const [erro,setErro]=useState(false);
  if(!src||erro) return null;
  return html`<img src=${src} alt=${alt||""} loading="lazy" referrerpolicy="no-referrer" onError=${()=>setErro(true)} style=${{width:size+"px",height:size+"px",objectFit:"contain"}}/>`;
}
function Clube({nome,size=22}){
  const src=escudoDe({nome});
  return html`<span style=${{display:"inline-flex",alignItems:"center",gap:"6px",minWidth:0}}>${src?html`<${EscImg} src=${src} alt="" size=${size}/>`:null}<span style=${{overflow:"hidden",textOverflow:"ellipsis"}}>${nome}</span></span>`;
}

function CatalogoClubes({st,up,toast}){
  const [serie,setSerie]=useState("C"); const [q,setQ]=useState("");
  const tem=new Set(st.adversarios.map(a=>normNome(a.nome)));
  const add=c=>{ if(tem.has(normNome(c[1]))){toast(c[1]+" já está nos adversários");return;} up(s=>({...s,adversarios:[...s.adversarios,{id:uid("adversarios"),nome:c[1],sigla:siglaDe(c[1]),escudo:"",serie:"Série "+c[0],sistema:"",fortes:"",fracos:"",obs:""}]})); toast(c[1]+" adicionado aos adversários"); };
  const lista=CLUBES.filter(c=>(!serie||c[0]===serie)&&(!q||normNome(c[1]).includes(normNome(q))));
  return html`<div class="grid" style=${{gap:"12px"}}>
    <div class="toolbar" style=${{marginBottom:0}}>
      <div class="seg">${[["A","Série A"],["B","Série B"],["C","Série C"],["D","Série D"],["","Todos"]].map(([k,l])=>html`<button key=${l} class=${serie===k?"on":""} onClick=${()=>setSerie(k)}>${l}</button>`)}</div>
      <input class="field grow" id="busca-clubes" placeholder="Buscar clube" value=${q} onInput=${e=>setQ(e.target.value)}/>

      ${c[1]==="Santa Cruz"?html`<span class="chip" style=${{color:"var(--red-ink)"}}>Nosso clube</span>`:tem.has(normNome(c[1]))?html`<span class="chip" style=${{color:"var(--good)"}}>Adversário</span>`:html`<button class="btn sm ro-hide" onClick=${()=>add(c)}>${I.plus}Adversário</button>`}
    </div>`)}</div>
  </div>`;
}

const ytId = u => { u=String(u||"").trim(); if(/^[\w-]{11}$/.test(u)) return u; const m=u.match(/(?:youtu\.be\/|[?&]v=|embed\/|live\/|shorts\/)([\w-]{11})/); return m?m[1]:""; };
const ytThumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
function YT({id,titulo,auto}){
  const [on,setOn]=useState(!!auto); const v=ytId(id);
  useEffect(()=>{ setOn(!!auto); },[v]);
  if(!v) return html`<div class="yt yt-vazio"><span>Sem vídeo cadastrado</span></div>`;
  return html`<div class="yt">${on
    ? html`<iframe src=${`https://www.youtube.com/embed/${v}?rel=0&autoplay=1&playsinline=1`} title=${titulo||"Vídeo"} allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`
    : html`<button type="button" class="yt-capa" onClick=${()=>setOn(true)} aria-label=${"Assistir "+(titulo||"vídeo")}><img src=${ytThumb(v)} alt="" loading="lazy"/><span class="yt-play" aria-hidden="true">▶</span>${titulo?html`<span class="yt-t">${titulo}</span>`:null}</button>`}</div>`;
}
function VideoModal({v,fechar}){
  useEffect(()=>{ const f=e=>{ if(e.key==="Escape") fechar(); }; addEventListener("keydown",f); return ()=>removeEventListener("keydown",f); },[]);
  if(!v) return null;
  return html`<div class="vmodal" role="dialog" aria-modal="true" aria-label=${v.titulo||"Vídeo"} onClick=${fechar}><div class="vmodal-box" onClick=${e=>e.stopPropagation()}>
    <div class="vmodal-h"><b>${v.titulo||"Vídeo"}</b><div style=${{display:"flex",gap:"6px"}}><a class="btn sm ghost" href=${"https://youtu.be/"+ytId(v.id)} target="_blank" rel="noopener">Abrir no YouTube</a><button class="btn sm" onClick=${fechar}>Fechar</button></div></div>
    <${YT} id=${v.id} titulo=${v.titulo} auto=${true}/>
  </div></div>`;
}

  const prox=st.jogos.filter(j=>!resJ(j)&&j.data>=hoje()).sort((a,b)=>a.data.localeCompare(b.data))[0];
  return html`<div class="grid" style=${{gap:"14px"}}>

const PACOTE = () => (typeof window!=="undefined" && window.SCOUTPRO_PACOTE) || null;
const treinoDoPacote = (t,i) => ({id:"tr-"+t.data+"-"+i,data:t.data,hora:t.hora||"",local:t.local||"",treinador:t.treinador||"",titulo:t.titulo||"Treino",video:t.video||"",compacto:t.compacto||"",obs:"",fonte:"WilScout"});
function arquivoPadrao(){ const p=PACOTE(); return p?(p.arquivo||[]).map(a=>({...a,id:"aw-"+a.ws})):[]; }
function treinosPadrao(){ const p=PACOTE(); return p?(p.treinos||[]).map(treinoDoPacote):[]; }
function aplicarPacote(s,p){
  if(!p||p.tipo!=="scoutpro-pacote-wilscout") throw new Error("Arquivo não é um pacote do WilScout");
  const tem=new Set((s.treinos||[]).map(t=>ytId(t.video)||t.data+t.hora));
  const comp=Object.fromEntries((p.treinos||[]).filter(t=>t.compacto).map(t=>[ytId(t.video),t.compacto]));
  const antigos=(s.treinos||[]).map(t=>!t.compacto&&comp[ytId(t.video)]?{...t,compacto:comp[ytId(t.video)]}:t);
  const novos=(p.treinos||[]).map(treinoDoPacote).filter(t=>!tem.has(ytId(t.video)||t.data+t.hora));
  const arqMap=new Map((s.arquivoJogos||[]).map(a=>[a.ws||a.id,a])); (p.arquivo||[]).forEach(a=>{ const old=arqMap.get(a.ws); arqMap.set(a.ws,{...(old||{}),...a,id:(old&&old.id)||"aw-"+a.ws}); });
  const arquivo=[...arqMap.values()].sort((a,b)=>(b.data||"").localeCompare(a.data||""));

function acharAtleta(nome){

  const q=ALIAS_ATL[q0]||q0; const L=(typeof ATLETAS_2026!=="undefined"?ATLETAS_2026:[]); let r=L.find(a=>normNome(a.nome)===q)||null;
  if(!r){ const qt=q.split(" "); r=L.find(a=>{ const ct=normNome(a.nome).split(" "); return qt.length===ct.length&&qt.every((t,i)=>t===ct[i]||(t.length<=2&&ct[i].startsWith(t))); })||null;
    if(!r&&qt.length>=2) r=L.find(a=>{ const ct=normNome(a.nome).split(" "); return ct.length>=2&&ct[0]===qt[0]&&ct[ct.length-1].startsWith(qt[qt.length-1]); })||null; }

}
function AvJ({nome,size=30,cor}){

/* Lances dos jogos (Flashscore + assistências lançadas) somados por atleta */
const _lancesMemo = new WeakMap();
function indiceLances(jogos){
  let m=_lancesMemo.get(jogos); if(m) return m; m=new Map();
  const k=nome=>{ const a=acharAtleta(nome); return a?a.nome:normNome(nome); };
  const add=(nome,campo,j)=>{ if(!nome||nome==="banco") return; const key=k(nome); let o=m.get(key); if(!o){ o={tot:{},comp:{},cartoes:[]}; m.set(key,o); } o.tot[campo]=(o.tot[campo]||0)+1; const c=j.competicao||""; o.comp[c]=o.comp[c]||{}; o.comp[c][campo]=(o.comp[c][campo]||0)+1; return o; };
  (jogos||[]).forEach(j=>(j.eventos||[]).forEach((e,i)=>{ if(e[0]!==1||e[4]==="banco") return; const t=e[1];
    if(t==="G"||t==="GP"){ add(e[3],"g",j); const as=assistDe(j,i); if(as) add(as,"a",j); }
    else if(t==="A"){ const o=add(e[3],"am",j); if(o) o.cartoes.push({data:j.data,tipo:"Amarelo",min:e[2],comp:j.competicao,adv:j.adversario}); }
    else if(t==="2A"||t==="V"){ const o=add(e[3],"vm",j); if(o) o.cartoes.push({data:j.data,tipo:t==="2A"?"Segundo amarelo":"Vermelho",min:e[2],comp:j.competicao,adv:j.adversario}); }
    else if(t==="S"){ add(e[3],"ent",j); add(e[4],"sai",j); } }));
  _lancesMemo.set(jogos,m); return m;
}
function lancesDe(st,nome,comp){ const a=acharAtleta(nome); const o=indiceLances(st.jogos).get(a?a.nome:normNome(nome)); if(!o) return {g:0,a:0,am:0,vm:0,ent:0,cartoes:[]}; const b=comp?(o.comp[comp]||{}):o.tot; return {g:b.g||0,a:b.a||0,am:b.am||0,vm:b.vm||0,ent:b.ent||0,cartoes:comp?o.cartoes.filter(c=>c.comp===comp):o.cartoes}; }
function NumerosAtl({st,nome}){

}

/* Importação de vários escudos de uma vez: o nome do arquivo identifica o clube */
function ImportarEscudos({up,toast}){
  const ref=useRef(); const [busy,setBusy]=useState(false);
  const pick=async e=>{
    const fs=[...(e.target.files||[])]; e.target.value=""; if(!fs.length) return; setBusy(true);
    const lidos=[]; for(const f of fs){ try{ lidos.push({nome:f.name.replace(/\.[^.]+$/,""), img:await lerEscudo(f)}); }catch(err){} }
    let nb=0, na=0, nn=0;
    up(s=>{
      const bench=s.bench.map(t=>{ const m=lidos.find(l=>normNome(l.nome)===normNome(t.nome)); if(m){nb++; return {...t,escudo:m.img};} return t; });
      let adv=s.adversarios.map(a=>{ const m=lidos.find(l=>normNome(l.nome)===normNome(a.nome)); if(m){na++; return {...a,escudo:m.img};} return a; });
      lidos.filter(l=>normNome(l.nome)!=="santa cruz" && !adv.some(a=>normNome(a.nome)===normNome(l.nome))).forEach(l=>{ nn++; adv.push({id:uid("adversarios"),nome:l.nome,sigla:l.nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase(),escudo:l.img,sistema:"",fortes:"",fracos:"",obs:""}); });
      return {...s,bench,adversarios:adv};
    });
    setBusy(false);
    setTimeout(()=>toast(`${lidos.length} escudos lidos · ${nb} no estudo da Série C · ${na} adversários atualizados · ${nn} adversários criados`),50);
  };
  return html`<span class="ro-hide"><button class="btn" disabled=${busy} onClick=${()=>ref.current.click()}>${I.export}${busy?"Lendo…":"Importar escudos"}</button><input type="file" id="imp-escudos" accept="image/*" multiple hidden ref=${ref} onChange=${pick}/></span>`;
}

/* ---------- Benchmark ---------- */
function Scatter({data,xl,yl,invY}){
  const W=560,H=340,L=46,R=16,Tp=16,B=40;
  const xs=data.map(d=>d.x), ys=data.map(d=>d.y);
  const pad=(a,b)=>{const r=(b-a)||1;return [a-r*.12,b+r*.12]};
  const [x0,x1]=pad(Math.min(...xs),Math.max(...xs)), [y0,y1]=pad(Math.min(...ys),Math.max(...ys));
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R), Y=v=> invY ? Tp+(v-y0)/(y1-y0)*(H-Tp-B) : H-B-(v-y0)/(y1-y0)*(H-Tp-B);
  const reg=regress(xs,ys);
  const nice=(a,b)=>{const st=Math.pow(10,Math.floor(Math.log10((b-a)/4)));const s=[1,2,5,10].map(m=>m*st).find(s=>(b-a)/s<=6)||st*10;const o=[];for(let v=Math.ceil(a/s)*s;v<=b;v+=s)o.push(+v.toFixed(2));return o;};
  const mx=avg(xs), my=avg(ys);
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${xl+" por "+yl}>
    ${nice(x0,x1).map(t=>html`<g key=${"x"+t}><line x1=${X(t)} x2=${X(t)} y1=${Tp} y2=${H-B} stroke="var(--line)"/><text x=${X(t)} y=${H-B+16} text-anchor="middle" font-size="11" fill="var(--mute)">${t}</text></g>`)}
    ${nice(y0,y1).map(t=>html`<g key=${"y"+t}><line x1=${L} x2=${W-R} y1=${Y(t)} y2=${Y(t)} stroke="var(--line)"/><text x=${L-8} y=${Y(t)+4} text-anchor="end" font-size="11" fill="var(--mute)">${t}</text></g>`)}
    <line x1=${X(mx)} x2=${X(mx)} y1=${Tp} y2=${H-B} stroke="var(--mute)" stroke-dasharray="4 4" opacity=".6"/>
    <line x1=${L} x2=${W-R} y1=${Y(my)} y2=${Y(my)} stroke="var(--mute)" stroke-dasharray="4 4" opacity=".6"/>
    <line x1=${X(x0)} y1=${Y(reg.i+reg.s*x0)} x2=${X(x1)} y2=${Y(reg.i+reg.s*x1)} stroke="var(--red)" stroke-width="2" opacity=".8"/>
    ${data.map(d=>html`<g key=${d.label}>${d.esc
      ? html`<circle cx=${X(d.x)} cy=${Y(d.y)} r="13" fill="var(--panel)" stroke="var(--line2)"/><image href=${d.esc} x=${X(d.x)-10} y=${Y(d.y)-10} width="20" height="20" preserveAspectRatio="xMidYMid meet"><title>${d.label}</title></image>`
      : html`<circle cx=${X(d.x)} cy=${Y(d.y)} r="6.5" fill="var(--fg)" stroke="var(--panel)" stroke-width="2"/>
      <text x=${X(d.x)+9} y=${Y(d.y)-7} font-size="10.5" fill="var(--fg)" font-weight="600" style=${{fontFamily:"Barlow Condensed,Arial Narrow,sans-serif",letterSpacing:".04em"}}>${d.label}</text>`}</g>`)}
    <text x=${(L+W-R)/2} y=${H-6} text-anchor="middle" font-size="12" fill="var(--mute)">${xl}</text>
    <text transform=${`translate(12 ${(Tp+H-B)/2}) rotate(-90)`} text-anchor="middle" font-size="12" fill="var(--mute)">${yl}</text>
  </svg>`;
}

function UsoChart({bench}){
  const W=560,H=230,L=34,B=38,Tp=10; const bw=(W-L-10)/bench.length;
  const max=Math.max(50,...bench.map(t=>n(t.usados)||0)); const Y=v=>H-B-v/max*(H-B-Tp);
  const media=avg(bench.map(t=>n(t.usados)));
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Uso do elenco por clube">
    ${[0,10,20,30,40,50].map(t=>html`<g key=${t}><line x1=${L} x2=${W} y1=${Y(t)} y2=${Y(t)} stroke="var(--line)"/><text x=${L-6} y=${Y(t)+4} text-anchor="end" font-size="10.5" fill="var(--mute)">${t}</text></g>`)}
    ${bench.map((t,i)=>{ const x=L+i*bw+bw*.15, w=bw*.7; const u=n(t.usados)||0, ti=n(t.tit)||0, ro=n(t.rot)||0;
      return html`<g key=${t.id}>
        <rect x=${x} y=${Y(u)} width=${w} height=${H-B-Y(u)} rx="2" fill="var(--panel2)" stroke="var(--line2)"/>
        <rect x=${x} y=${Y(ti+ro)} width=${w} height=${H-B-Y(ro)} rx="0" fill="var(--mute)" opacity=".7"/>
        <rect x=${x} y=${Y(ti)} width=${w} height=${H-B-Y(ti)} rx="0" fill="var(--red)"/>
        ${escudoDe(t)?html`<image href=${escudoDe(t)} x=${x+w/2-8} y=${H-B+3} width="16" height="16" preserveAspectRatio="xMidYMid meet"/>`
          :html`<text x=${x+w/2} y=${H-B+14} text-anchor="middle" font-size="10.5" fill="var(--fg)" style=${{fontFamily:"Barlow Condensed,Arial Narrow,sans-serif",fontWeight:700}}>${t.sigla}</text>`}
        <text x=${x+w/2} y=${H-B+27} text-anchor="middle" font-size="9.5" fill="var(--mute)">${String(t.ano).slice(-2)}</text>
      </g>`; })}
    ${media?html`<line x1=${L} x2=${W} y1=${Y(media)} y2=${Y(media)} stroke="var(--fg)" stroke-dasharray="5 4"/><text x=${W-4} y=${Y(media)-5} text-anchor="end" font-size="11" fill="var(--fg)">média ${f1(media)}</text>`:null}
  </svg>`;
}

/* ---------- Planejamento 2027 ---------- */
function Plano({st,up,toast}){
  const ano=2027;
  const dec=id=>st.decisoes[id]||"Avaliar";
  const setDec=(id,v)=>up(s=>({...s, decisoes:{...s.decisoes,[id]:v}}));
  const setA=(id,k,v)=>up(s=>({...s, alvos:s.alvos.map(a=>a.id===id?{...a,[k]:v}:a)}));
  const addA=pos=>{ up(s=>({...s, alvos:[...s.alvos,{id:uid("a"),nome:"",pos:pos||"ATA",nasc:"",clube:"",salario:"",prioridade:"Alta",status:"Monitorando",obs:""}]})); toast("Alvo adicionado"); };
  const delA=id=>up(s=>({...s, alvos:s.alvos.filter(a=>a.id!==id)}));

  const ficam = st.elenco.filter(j=>FICA_2027.has(dec(j.id)));
  const abertos = st.elenco.filter(j=>dec(j.id)==="Avaliar");
  const saem = st.elenco.filter(j=>!FICA_2027.has(dec(j.id)) && dec(j.id)!=="Avaliar");
  const chegam = st.alvos.filter(a=>a.status==="Fechado" || (st.incluirNeg && a.status==="Em negociação"));
  const proj = [...ficam, ...chegam.map(a=>({...a, nasc:a.nasc}))];
  const pp = porPos(proj,ano);
  const idadeProj = avg(proj.map(j=>idade(j,ano)));
  const benchIdade = avg(st.bench.map(t=>n(t.idade)));
  const comFica = st.comissao.filter(c=>FICA_2027.has(c.sit2027));
  const folha = sum(ficam.map(j=>j.salario)) + sum(chegam.map(a=>a.salario)) + sum(comFica.map(c=>c.salario));
  const orc = n(st.orc2027);
  const vencem = st.elenco.filter(j=>n(j.contrato)!==null && n(j.contrato)<=2026);

  const necessidades = POS.map(p=>{ const alvo=Math.round(BENCH_QTD[p.k]); const tem=pp[p.k].qtd; const mon=st.alvos.filter(a=>a.pos===p.k&&a.status!=="Descartado"&&!chegam.includes(a)).length;
    return {p, alvo, tem, falta:Math.max(0,alvo-tem), mon, idade:pp[p.k].idade}; });
  const totalFalta = necessidades.reduce((s,x)=>s+x.falta,0);

  return html`<div class="grid" style=${{gap:"16px"}}>
    <div class="grid g-kpi">

      <${Kpi} l="Idade em 2027" v=${f1(idadeProj)} u="anos" d=${html`<${Delta} a=${idadeProj} b=${benchIdade} inv=${true}/> vs perfil de acesso`}/>
      <${Kpi} l="Vagas a preencher" v=${totalFalta} d="para a profundidade média dos acessos"/>
      <${Kpi} cls="money" l="Folha projetada" v=${folha?brl(folha):"—"} d=${html`${orc?html`<span class=${folha>orc?"up":"ok"}>${Math.round(folha/orc*100)}%</span> do teto · `:""}inclui ${comFica.length} da comissão`}/>
    </div>

    <div class="card">
      <div class="card-h"><div><h2>Parâmetros 2027</h2><p>Mudam a projeção na hora</p></div></div>
      <div class="grid" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))"}}>

      </div>
      ${orc?html`<div class="money" style=${{marginTop:"14px"}}><div class=${"bar"+(folha>orc?" over":"")}><i style=${{width:Math.min(100,folha/orc*100)+"%"}}></i></div><p class="note">${brl(folha)} de ${brl(orc)} · saldo ${brl(orc-folha)}</p></div>`:null}
      ${st.comp2027==="Série B"?html`<p class="note" style=${{marginTop:"8px"}}>As referências de profundidade e idade vêm do estudo da Série C; para a Série B, use-as como piso.</p>`:null}
    </div>

        ${necessidades.map(x=>html`<div class="need" key=${x.p.k} style=${{borderLeft:`3px solid ${x.falta?"var(--bad)":"var(--good)"}`}}>

/* ---------- Base para os módulos ---------- */
const hoje = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDias = (iso,k) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+k); return d.toISOString().slice(0,10); };
const diasEntre = (a,b) => Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fmtD = iso => iso ? new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) : "—";
const fmtDL = iso => new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const SEMANA = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
function crud(up,key){ return {
  add:(o={})=>{ const id=uid(key); up(s=>({...s,[key]:[{id,...o},...(s[key]||[])]})); return id; },
  addMany:list=>up(s=>({...s,[key]:[...list.map(o=>({id:uid(key),...o})),...(s[key]||[])]})),
  set:(id,k,v)=>up(s=>({...s,[key]:(s[key]||[]).map(r=>r.id===id?{...r,[k]:v}:r)})),
  del:id=>up(s=>({...s,[key]:(s[key]||[]).filter(r=>r.id!==id)})) }; }
const atl = (st,id) => st.elenco.find(j=>j.id===id);
const nomeA = (st,id) => (atl(st,id)||{}).nome || "—";
const ativos = st => st.elenco.filter(j=>(j.vinculo||"Ativo")==="Ativo");
const ultimo = (lista,id) => lista.filter(p=>p.atleta===id && p.data).sort((a,b)=>b.data.localeCompare(a.data))[0];

function acwr(st,id,ate=hoje()){
  const c=st.pse.filter(p=>p.atleta===id&&p.data).map(p=>({d:diasEntre(p.data,ate),c:(n(p.pse)||0)*(n(p.min)||0)})).filter(x=>x.d>=0&&x.d<28);
  if(!c.length) return null;
  const ag=c.filter(x=>x.d<7).reduce((s,x)=>s+x.c,0), cr=c.reduce((s,x)=>s+x.c,0)/4;
  return cr ? ag/cr : null;
}
function prontidao(st,j){
  const ps=ultimo(st.psr,j.id); let sc=null;
  if(ps){ const v=[n(ps.sono),n(ps.recup),n(ps.humor),n(ps.fadiga)!=null?11-n(ps.fadiga):null,n(ps.dor)!=null?10-n(ps.dor):null].filter(x=>x!=null); sc=v.length?Math.min(100,avg(v)*10):null; }
  const a=acwr(st,j.id);
  if(sc!=null && a!=null && a>1.5) sc-=15;
  if(j.saude==="Não liberado") sc=0; else if(sc!=null && j.saude==="Em transição") sc=Math.min(sc,60);
  return {sc: sc==null?null:Math.max(0,Math.round(sc)), a, ps};
}
const corPront = v => v==null?"var(--faint)":v>=75?"var(--good)":v>=55?"var(--warn)":"var(--bad)";
const corAcwr = a => a==null?"var(--faint)":a>1.5?"var(--bad)":a>1.3?"var(--warn)":a<0.8?"var(--info)":"var(--good)";

function Abas({tabs,v,set}){

}
function useAba(chave,padraoAba){

  const set=x=>{ setV(x); try{ localStorage.setItem("scoutpro.aba."+chave,x); }catch(e){} };
  return [v,set];
}
function Chip({txt,cor}){ return html`<span class="chip" style=${{color:cor,borderColor:`color-mix(in srgb, ${cor} 45%, transparent)`,background:`color-mix(in srgb, ${cor} 12%, transparent)`}}>${txt}</span>`; }
function Barra({v,max=100,cor="var(--red)"}){ return html`<div class="bar"><i style=${{width:Math.max(0,Math.min(100,(v||0)/max*100))+"%",background:cor}}></i></div>`; }

/* Tabela editável genérica: cada coluna diz seu tipo */
function Tabela({st,rows,cols,api,vazio}){
  if(!rows.length) return html`<div class="empty">${vazio||"Nenhum registro ainda."}</div>`;
  const cell=(r,c)=>{
    const v=r[c.k]??"", id=c.k+"-"+r.id, on=e=>api.set(r.id,c.k,c.t==="check"?e.target.checked:e.target.value);
    if(c.t==="calc"){ const x=c.f(r); return html`<span class="num" style=${c.cor?{color:c.cor(r),fontWeight:600}:null}>${x}</span>`; }
    if(c.t==="select") return html`<select class="cell" id=${id} value=${v} onChange=${on} style=${{minWidth:c.w||"110px",...(c.cor?{color:c.cor(v),fontWeight:600}:{})}}>${(c.vazio?[""]:[]).concat(c.opts).map(o=>html`<option key=${o} value=${o}>${o||"—"}</option>`)}</select>`;
    if(c.t==="atleta") return html`<select class="cell" id=${id} value=${v} onChange=${on} style=${{minWidth:"150px",fontWeight:600}}><option value="">Selecione…</option>${st.elenco.map(j=>html`<option key=${j.id} value=${j.id}>${j.nome}</option>`)}</select>`;
    if(c.t==="check") return html`<input type="checkbox" id=${id} checked=${!!v} onChange=${on} style=${{accentColor:"var(--red)",width:"16px",height:"16px"}}/>`;
    if(c.t==="date") return html`<input class="cell" type="date" id=${id} value=${v} onInput=${on} style=${{minWidth:"132px"}}/>`;
    if(c.t==="time") return html`<input class="cell" type="time" id=${id} value=${v} onInput=${on} style=${{minWidth:"92px"}}/>`;
    if(c.t==="num") return html`<input class="cell n" id=${id} inputmode="decimal" value=${v} onInput=${on} style=${{width:c.w||"62px"}}/>`;
    if(c.t==="link") return html`<div style=${{display:"flex",gap:"4px",alignItems:"center"}}><input class="cell" id=${id} value=${v} onInput=${on} placeholder="https://…" style=${{minWidth:"140px"}}/>${/^https?:\/\//.test(v)?html`<a class="btn sm ghost" href=${v} target="_blank" rel="noopener">Abrir</a>`:null}</div>`;
    return html`<input class="cell" id=${id} value=${v} onInput=${on} placeholder=${c.ph||""} style=${{minWidth:c.w||"120px"}}/>`;
  };
  const dir=c=>c.t==="num"||c.t==="calc"?"r":"";
  return html`<div class="tablewrap"><table><thead><tr>${cols.map(c=>html`<th key=${c.k} class=${dir(c)}>${c.l}</th>`)}<th></th></tr></thead>
    <tbody>${rows.map(r=>html`<tr key=${r.id}>${cols.map(c=>html`<td key=${c.k} class=${dir(c)}>${cell(r,c)}</td>`)}<td><${Del} onYes=${()=>api.del(r.id)}/></td></tr>`)}</tbody></table></div>`;
}

/* Gráfico simples de linha ou barras, com rótulos por ponto */
function Serie({pts,h=170,tipo="barra",cor="var(--red)",ymin,ymax,fmt=f1,refY,refTxt}){
  const W=560,H=h,L=36,R=12,Tp=14,B=26;
  const ys=pts.map(p=>p.y).filter(v=>v!=null&&isFinite(v));
  if(!ys.length) return html`<div class="empty" style=${{padding:"20px"}}>Sem dados no período.</div>`;
  let lo=ymin??Math.min(0,...ys), hi=ymax??Math.max(...ys,refY??-Infinity); if(!(hi>lo)) hi=lo+1;
  const Y=v=>H-B-(v-lo)/(hi-lo)*(H-B-Tp), slot=(W-L-R)/pts.length, X=i=>L+slot*i+slot/2;
  const ticks=[lo,lo+(hi-lo)/2,hi];
  const linha=pts.map((p,i)=>p.y==null?null:`${X(i)},${Y(p.y)}`).filter(Boolean).join(" ");
  const passo=Math.ceil(pts.length/10);
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img">
    ${ticks.map((t,i)=>html`<g key=${i}><line x1=${L} x2=${W-R} y1=${Y(t)} y2=${Y(t)} stroke="var(--line)"/><text x=${L-6} y=${Y(t)+4} text-anchor="end" font-size="10.5" fill="var(--mute)">${fmt(t)}</text></g>`)}
    ${refY!=null?html`<line x1=${L} x2=${W-R} y1=${Y(refY)} y2=${Y(refY)} stroke="var(--fg)" stroke-dasharray="5 4" opacity=".6"/><text x=${W-R} y=${Y(refY)-5} text-anchor="end" font-size="10.5" fill="var(--fg)">${refTxt||""}</text>`:null}
    ${tipo==="barra"
      ? pts.map((p,i)=>p.y==null?null:html`<rect key=${i} x=${X(i)-slot*.32} y=${Math.min(Y(p.y),Y(Math.max(lo,0)))} width=${slot*.64} height=${Math.abs(Y(p.y)-Y(Math.max(lo,0)))} rx="2" fill=${p.cor||cor}/>`)
      : html`<polyline points=${linha} fill="none" stroke=${cor} stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>p.y==null?null:html`<circle key=${i} cx=${X(i)} cy=${Y(p.y)} r="3.5" fill=${cor}/>`)}`}
    ${pts.map((p,i)=>i%passo===0?html`<text key=${"x"+i} x=${X(i)} y=${H-8} text-anchor="middle" font-size="10" fill="var(--mute)">${p.x}</text>`:null)}
  </svg>`;
}
function ultimosDias(k,fim=hoje()){ return Array.from({length:k},(_,i)=>addDias(fim,i-k+1)); }

/* ---------- Hub de Performance ---------- */
function Hub({st,go}){
  const at=ativos(st), gk=at.filter(j=>j.pos==="GOL"), linha=at.filter(j=>j.pos!=="GOL");
  const c=k=>at.filter(j=>(j.saude||"Liberado")===k).length;
  const dores=st.psr.filter(p=>p.data&&diasEntre(p.data,hoje())<14&&diasEntre(p.data,hoje())>=0&&n(p.dor)>=4).sort((a,b)=>b.data.localeCompare(a.data));
  const queixas=st.atend.filter(a=>a.data&&diasEntre(a.data,hoje())<30&&diasEntre(a.data,hoje())>=0).sort((a,b)=>b.data.localeCompare(a.data));
  const rec=ultimosDias(7).map(d=>({x:new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short"}),y:avg(st.psr.filter(p=>p.data===d).map(p=>n(p.recup)))}));
  const pr=at.map(j=>({j,...prontidao(st,j)})).sort((a,b)=>(b.sc??-1)-(a.sc??-1));
  const libLinha=linha.filter(j=>(j.saude||"Liberado")==="Liberado").length;
  return html`<div class="grid" style=${{gap:"16px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Atletas de linha liberados" v=${libLinha} d=${`${linha.length?Math.round(libLinha/linha.length*100):0}% da linha`}/>
      <${Kpi} l="Goleiros liberados" v=${gk.filter(j=>(j.saude||"Liberado")==="Liberado").length} d=${`de ${gk.length} goleiros`}/>
      <${Kpi} l="Em observação" v=${c("Sob observação")} d="liberados com observação"/>
      <${Kpi} l="Em transição" v=${c("Em transição")} d="retorno progressivo"/>
      <${Kpi} l="Indisponíveis" v=${c("Não liberado")} d="afastados"/>
    </div>
    <div class="grid g-3">
      <div class="card"><div class="card-h"><div><h2>Dores PSR</h2><p>Últimos 14 dias · dor ≥ 4</p></div><button class="btn sm ghost" onClick=${()=>go("fisiologia")}>Registrar →</button></div>
        ${dores.length?html`<div class="alerts">${dores.slice(0,8).map(p=>html`<div key=${p.id} class="alert bad"><div><b>${nomeA(st,p.atleta)} · dor ${p.dor}</b><span>${fmtD(p.data)}${p.regiao?" · "+p.regiao:""}</span></div></div>`)}</div>`:html`<p class="note">Nenhuma dor relevante registrada nos últimos 14 dias.</p>`}</div>
      <div class="card"><div class="card-h"><div><h2>Queixas fisioterapia</h2><p>Últimos 30 dias</p></div><button class="btn sm ghost" onClick=${()=>go("fisioterapia")}>Abrir →</button></div>
        ${queixas.length?html`<div class="alerts">${queixas.slice(0,8).map(a=>html`<div key=${a.id} class="alert"><div><b>${nomeA(st,a.atleta)}</b><span>${fmtD(a.data)} · ${a.queixa||"—"}${a.regiao?" · "+a.regiao:""}</span></div></div>`)}</div>`:html`<p class="note">Nenhuma queixa registrada nos últimos 30 dias.</p>`}</div>
      <div class="card"><div class="card-h"><div><h2>Recuperação média</h2><p>Percepção de recuperação (1–10) por dia</p></div></div><${Serie} pts=${rec} ymin=${0} ymax=${10} cor="var(--good)"/></div>
    </div>
    <div class="card">
      <div class="card-h"><div><h2>Algoritmo de prontidão</h2><p>Último PSR (sono, fadiga, dor, humor, recuperação) + ACWR da carga (PSE × minutos) + status médico</p></div>
        <div class="legend"><span><i style=${{background:"var(--good)"}}></i>≥ 75</span><span><i style=${{background:"var(--warn)"}}></i>55–74</span><span><i style=${{background:"var(--bad)"}}></i>${"< 55"}</span></div></div>
      ${pr.some(x=>x.sc!=null)||pr.some(x=>x.a!=null) ? html`<div class="pront">${pr.map(({j,sc,a,ps})=>html`<div key=${j.id} class="pront-i">
          <${AvJ} nome=${j.nome} cor=${corPront(sc)}/>
          <div style=${{minWidth:0,flex:1}}><div class="nm">${j.nome}</div><div class="meta">${POSN[j.pos]?.s} · ${ps?"PSR "+fmtD(ps.data):"sem PSR"} · ACWR <span style=${{color:corAcwr(a)}}>${a==null?"—":f2(a)}</span></div><${Barra} v=${sc} cor=${corPront(sc)}/></div>
          <b class="num" style=${{color:corPront(sc),fontFamily:"var(--f-display)",fontSize:"24px",minWidth:"40px",textAlign:"right"}}>${sc??"—"}</b></div>`)}</div>`
      : html`<div class="empty">Nenhum dado de atleta ainda. Registre o bem-estar (PSR) e a carga (PSE) em Fisiologia para ver a prontidão.</div>`}
    </div>
  </div>`;
}

  const ano=new Date().getFullYear();
  const set=(id,k,v)=>up(s=>({...s, elenco:s.elenco.map(j=>j.id===id?{...j,[k]:v}:j)}));
  const base=st.elenco.filter(j=>!fv||(j.vinculo||"Ativo")===fv);
  const lista=base.filter(j=>(!fp||j.pos===fp)&&(!fs||(j.saude||"Liberado")===fs)&&(!fd||(fd==="com"?!!j.dor:!j.dor))&&(!q||j.nome.toLowerCase().includes(q.toLowerCase())))
    .map(j=>({...j,_p:prontidao(st,j)}))
    .sort((a,b)=>ord==="pos"?POS.findIndex(p=>p.k===a.pos)-POS.findIndex(p=>p.k===b.pos):ord==="status"?SAUDE.indexOf(a.saude||"Liberado")-SAUDE.indexOf(b.saude||"Liberado"):ord==="rec"?(b._p.sc??-1)-(a._p.sc??-1):a.nome.localeCompare(b.nome));
  const at=base; const c=k=>at.filter(j=>(j.saude||"Liberado")===k).length;
  return html`<div class="grid" style=${{gap:"14px"}}>
    <div class="grid g-kpi">
      <${Kpi} l="Atletas de linha lib." v=${at.filter(j=>j.pos!=="GOL"&&(j.saude||"Liberado")==="Liberado").length}/>
      <${Kpi} l="Goleiros disp." v=${at.filter(j=>j.pos==="GOL"&&(j.saude||"Liberado")==="Liberado").length}/>
      <${Kpi} l="Lib. c/ obs." v=${c("Sob observação")}/>
